<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yönetim — e-Misafir</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f8f7f4;
  --bg2: #f0ede6;
  --card: #fff;
  --border: #e4ddd3;
  --gold: #b8913f;
  --gold2: #d4a853;
  --dark: #1c1917;
  --mid: #78716c;
  --light: #a8a29e;
  --green: #16a34a;
  --red: #dc2626;
  --radius: 10px;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
}
html { height: 100dvh; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--dark);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#header {
  background: var(--dark);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.h-title { color: #fff; font-size: .95rem; font-weight: 700; }
.h-sub { color: var(--gold2); font-size: .7rem; margin-top: 1px; }

#tabs {
  display: flex;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tab {
  flex: 1;
  border: none;
  background: none;
  padding: 10px 4px;
  font-family: var(--font);
  font-size: .68rem;
  color: var(--light);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  -webkit-tap-highlight-color: transparent;
}
.tab.active { color: var(--dark); border-bottom-color: var(--gold); font-weight: 600; }

.screen { display: none; flex-direction: column; flex: 1; overflow: hidden; min-height: 0; }
.screen.active { display: flex; }
.scroll-area { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px; }

/* ── HOTELS ── */
.hotel-card {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 14px;
  margin-bottom: 10px;
}
.hc-name { font-size: .9rem; font-weight: 700; margin-bottom: 4px; }
.hc-meta { font-size: .7rem; color: var(--mid); margin-bottom: 10px; }
.hc-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.btn-sm {
  border: none;
  border-radius: 7px;
  padding: 7px 11px;
  font-size: .7rem;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.btn-primary { background: var(--dark); color: var(--gold2); }
.btn-secondary { background: var(--bg2); color: var(--mid); border: 1px solid var(--border); }
.btn-danger { background: #fee2e2; color: var(--red); border: 1px solid #fca5a5; }
.btn-green { background: #dcfce7; color: var(--green); border: 1px solid #86efac; }

.progress-bar {
  height: 6px;
  background: var(--bg2);
  border-radius: 3px;
  margin-top: 8px;
  overflow: hidden;
  display: none;
}
.progress-bar.show { display: block; }
.progress-fill {
  height: 100%;
  background: var(--gold);
  border-radius: 3px;
  transition: width .3s;
}

/* ── MENU EDITOR ── */
.menu-item-row {
  background: var(--card);
  border-radius: 8px;
  border: 1px solid var(--border);
  padding: 10px 12px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.mr-emoji { font-size: 1.2rem; flex-shrink: 0; }
.mr-info { flex: 1; min-width: 0; }
.mr-name { font-size: .8rem; font-weight: 600; }
.mr-cat { font-size: .63rem; color: var(--light); }
.mr-price { font-size: .8rem; font-weight: 700; color: var(--gold); }
.mr-del {
  width: 28px; height: 28px;
  border: none; background: #fee2e2;
  color: var(--red); border-radius: 6px;
  font-size: .75rem; cursor: pointer;
  flex-shrink: 0;
  -webkit-tap-highlight-color: transparent;
}

/* ── FORM ── */
.form-section {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 14px;
  margin-bottom: 12px;
}
.form-title { font-size: .78rem; font-weight: 700; margin-bottom: 10px; color: var(--dark); }
.form-row { margin-bottom: 8px; }
.form-label { font-size: .68rem; color: var(--mid); margin-bottom: 3px; display: block; font-weight: 600; }
.form-input, .form-select {
  width: 100%;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  font-size: .8rem;
  font-family: var(--font);
  color: var(--dark);
  background: var(--bg);
  outline: none;
  -webkit-appearance: none;
}
.form-input:focus, .form-select:focus { border-color: var(--gold); }
.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.btn-full {
  width: 100%;
  border: none;
  border-radius: 8px;
  padding: 12px;
  font-size: .82rem;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.btn-full.primary { background: var(--dark); color: var(--gold2); }
.btn-full.success { background: var(--green); color: #fff; }

#status-msg {
  padding: 8px 12px;
  border-radius: 8px;
  font-size: .72rem;
  font-weight: 600;
  margin-top: 8px;
  display: none;
}
#status-msg.ok { background: #dcfce7; color: var(--green); display: block; }
#status-msg.err { background: #fee2e2; color: var(--red); display: block; }

.hotel-selector {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  align-items: center;
}
.hotel-selector label { font-size: .72rem; color: var(--mid); font-weight: 600; flex-shrink: 0; }
.hotel-selector select {
  flex: 1;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  padding: 7px 10px;
  font-size: .8rem;
  font-family: var(--font);
  background: var(--bg);
  outline: none;
}
</style>
</head>
<body>

<div id="header">
  <div>
    <div class="h-title">⚙️ Yönetim Paneli</div>
    <div class="h-sub">e-Misafir Admin</div>
  </div>
</div>

<div id="tabs">
  <button type="button" class="tab active" onclick="switchTab('hotels')">🏨 Oteller</button>
  <button type="button" class="tab" onclick="switchTab('menu')">🍽 Menü</button>
  <button type="button" class="tab" onclick="switchTab('add')">➕ Yeni Otel</button>
</div>

<!-- OTELLER -->
<div class="screen active" id="s-hotels">
  <div class="scroll-area">
    <div id="hotel-list"><div style="color:var(--light);font-size:.78rem;text-align:center;padding:20px">Yükleniyor...</div></div>
  </div>
</div>

<!-- MENÜ -->
<div class="screen" id="s-menu">
  <div class="scroll-area">
    <div class="hotel-selector">
      <label>Otel:</label>
      <select id="menu-hotel-sel" onchange="loadMenuEditor()"></select>
    </div>
    <div class="form-section">
      <div class="form-title">Yeni Ürün Ekle</div>
      <div class="form-row-2">
        <div class="form-row">
          <label class="form-label">Emoji</label>
          <input class="form-input" id="ni-emoji" placeholder="🍔" maxlength="4">
        </div>
        <div class="form-row">
          <label class="form-label">Fiyat (₺)</label>
          <input class="form-input" id="ni-price" type="number" placeholder="80">
        </div>
      </div>
      <div class="form-row">
        <label class="form-label">Ürün Adı</label>
        <input class="form-input" id="ni-name" placeholder="Izgara Tavuk">
      </div>
      <div class="form-row">
        <label class="form-label">Kategori</label>
        <input class="form-input" id="ni-cat" placeholder="Tavuk Yemekleri">
      </div>
      <div class="form-row-2">
        <div class="form-row">
          <label class="form-label">Başlangıç</label>
          <input class="form-input" id="ni-start" type="time" value="00:00">
        </div>
        <div class="form-row">
          <label class="form-label">Bitiş</label>
          <input class="form-input" id="ni-end" type="time" value="23:59">
        </div>
      </div>
      <button type="button" class="btn-full primary" onclick="addItem()">+ Ürün Ekle</button>
    </div>
    <div id="menu-item-list"></div>
  </div>
</div>

<!-- YENİ OTEL -->
<div class="screen" id="s-add">
  <div class="scroll-area">
    <div class="form-section">
      <div class="form-title">Yeni Otel Ekle</div>
      <div class="form-row">
        <label class="form-label">Otel ID (küçük harf, boşluksuz)</label>
        <input class="form-input" id="new-id" placeholder="grand-hotel">
      </div>
      <div class="form-row">
        <label class="form-label">Otel Adı</label>
        <input class="form-input" id="new-name" placeholder="Grand Hotel">
      </div>
      <div class="form-row">
        <label class="form-label">Şehir</label>
        <input class="form-input" id="new-city" placeholder="İstanbul">
      </div>
      <div class="form-row">
        <label class="form-label">Oda numaraları (virgülle, örn: 101,102,103)</label>
        <input class="form-input" id="new-rooms" placeholder="101,102,103,201,202">
      </div>
      <button type="button" class="btn-full primary" onclick="createHotel()" style="margin-top:4px">Oteli Oluştur + Menü Yükle</button>
      <div id="status-msg"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyAV06sT1lBDNjMIA2EpoTK5uSRn3-mVqz4",
  authDomain: "emisafir-56796.firebaseapp.com",
  databaseURL: "https://emisafir-56796-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "emisafir-56796"
});
var db = firebase.database();

/* ── TABS ── */
var activeTab = 'hotels';
function switchTab(t) {
  activeTab = t;
  document.querySelectorAll('.tab').forEach(function(el){ el.classList.remove('active'); });
  document.querySelectorAll('.screen').forEach(function(el){ el.classList.remove('active'); });
  var tabOrder = ['hotels','menu','add'];
  document.querySelectorAll('.tab')[tabOrder.indexOf(t)].classList.add('active');
  document.getElementById('s-'+t).classList.add('active');
  if (t==='menu') populateHotelSel();
}

/* ── HOTELS ── */
var hotelsData = {};

db.ref('hotels').on('value', function(snap) {
  hotelsData = {};
  var list = document.getElementById('hotel-list');
  list.innerHTML = '';
  if (!snap.exists()) {
    list.innerHTML = '<div style="color:var(--light);font-size:.78rem;text-align:center;padding:20px">Otel bulunamadı</div>';
    return;
  }
  snap.forEach(function(c) {
    hotelsData[c.key] = c.val();
    list.appendChild(buildHotelCard(c.key, c.val()));
  });
});

function buildHotelCard(id, v) {
  var info = v.info || {};
  var roomCount = Object.keys(info.rooms || {}).length;
  var menuCount = Object.keys(v.menu || {}).length;

  var card = document.createElement('div');
  card.className = 'hotel-card';
  card.id = 'hc-'+id;
  card.innerHTML =
    '<div class="hc-name">🏨 '+ esc(info.name||id) +'</div>' +
    '<div class="hc-meta">'+ esc(info.city||'—') +' · '+roomCount+' oda · '+menuCount+' ürün</div>' +
    '<div class="hc-btns">' +
      '<button type="button" class="btn-sm btn-primary" onclick="openQR(\''+id+'\')">📱 QR</button>' +
      '<button type="button" class="btn-sm btn-green" onclick="refreshMenu(\''+id+'\')" id="ref-'+id+'">🔄 Menüyü Yenile</button>' +
      '<button type="button" class="btn-sm btn-secondary" onclick="window.open(\'resepsiyon.html?hotel='+id+'\',\'_blank\')">Resepsiyon</button>' +
    '</div>' +
    '<div class="progress-bar" id="prog-'+id+'"><div class="progress-fill" id="progfill-'+id+'" style="width:0%"></div></div>';
  return card;
}

function openQR(hotelId) {
  var v = hotelsData[hotelId];
  if (!v) return;
  var rooms = Object.keys((v.info||{}).rooms || {});
  if (!rooms.length) { alert('Bu otele ait oda bulunamadı.'); return; }
  var base = location.origin + location.pathname.replace('yonetim.html','') + 'misafir.html';
  var w = window.open('', '_blank');
  var html = '<html><head><title>QR Kodlar — '+esc(hotelId)+'</title><style>body{font-family:sans-serif;padding:20px}h2{margin-bottom:16px}.grid{display:flex;flex-wrap:wrap;gap:16px}.item{text-align:center;border:1px solid #eee;border-radius:8px;padding:12px}img{display:block}p{font-size:.8rem;margin-top:6px}</style></head><body>';
  html += '<h2>'+esc((v.info||{}).name||hotelId)+' — QR Kodlar</h2><div class="grid">';
  rooms.forEach(function(r) {
    var url = base + '?hotel=' + encodeURIComponent(hotelId) + '&room=' + encodeURIComponent(r);
    var qr = 'https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=' + encodeURIComponent(url);
    html += '<div class="item"><img src="'+qr+'" width="150" height="150"><p>Oda '+r+'</p></div>';
  });
  html += '</div></body></html>';
  w.document.write(html);
  w.document.close();
}

/* ── MENU REFRESH ── */
async function refreshMenu(hotelId) {
  var btn = document.getElementById('ref-'+hotelId);
  var prog = document.getElementById('prog-'+hotelId);
  var fill = document.getElementById('progfill-'+hotelId);
  btn.disabled = true; btn.textContent = 'Siliyor...';
  prog.classList.add('show'); fill.style.width = '10%';

  await db.ref('hotels/'+hotelId+'/menu').remove();
  fill.style.width = '30%'; btn.textContent = 'Yükleniyor...';

  var menu = getFullMenu();
  var total = menu.length; var done = 0;
  for (var i=0; i<menu.length; i++) {
    await db.ref('hotels/'+hotelId+'/menu').push(menu[i]);
    done++;
    fill.style.width = Math.round(30 + (done/total)*70) + '%';
  }

  fill.style.width = '100%';
  btn.disabled = false; btn.textContent = '✅ Tamamlandı';
  setTimeout(function(){ btn.textContent='🔄 Menüyü Yenile'; prog.classList.remove('show'); fill.style.width='0%'; }, 2000);
}

/* ── MENU EDITOR ── */
function populateHotelSel() {
  var sel = document.getElementById('menu-hotel-sel');
  sel.innerHTML = '';
  Object.keys(hotelsData).forEach(function(id) {
    var o = document.createElement('option');
    o.value = id;
    o.textContent = (hotelsData[id].info||{}).name || id;
    sel.appendChild(o);
  });
  loadMenuEditor();
}

function loadMenuEditor() {
  var hotelId = document.getElementById('menu-hotel-sel').value;
  if (!hotelId) return;
  var list = document.getElementById('menu-item-list');
  list.innerHTML = '<div style="color:var(--light);font-size:.72rem;padding:8px">Yükleniyor...</div>';
  db.ref('hotels/'+hotelId+'/menu').once('value', function(snap) {
    list.innerHTML = '';
    if (!snap.exists()) { list.innerHTML='<div style="color:var(--light);font-size:.72rem;padding:8px">Ürün bulunamadı</div>'; return; }
    snap.forEach(function(c) {
      var v = c.val();
      var row = document.createElement('div');
      row.className = 'menu-item-row';
      row.innerHTML =
        '<div class="mr-emoji">'+(v.emoji||'🍽')+'</div>' +
        '<div class="mr-info">' +
          '<div class="mr-name">'+esc(v.name)+'</div>' +
          '<div class="mr-cat">'+esc(v.category||'')+'</div>' +
        '</div>' +
        '<div class="mr-price">₺'+v.price+'</div>' +
        '<button type="button" class="mr-del" onclick="delItem(\''+hotelId+'\',\''+c.key+'\')">✕</button>';
      list.appendChild(row);
    });
  });
}

function addItem() {
  var hotelId = document.getElementById('menu-hotel-sel').value;
  if (!hotelId) return;
  var name = document.getElementById('ni-name').value.trim();
  var price = parseFloat(document.getElementById('ni-price').value);
  var emoji = document.getElementById('ni-emoji').value.trim() || '🍽';
  var cat = document.getElementById('ni-cat').value.trim() || 'Diğer';
  var start = document.getElementById('ni-start').value || '00:00';
  var end = document.getElementById('ni-end').value || '23:59';
  if (!name || !price) { alert('Ad ve fiyat zorunlu'); return; }
  db.ref('hotels/'+hotelId+'/menu').push({ name, price, emoji, category:cat, startTime:start, endTime:end, active:true })
    .then(function(){ loadMenuEditor(); document.getElementById('ni-name').value=''; document.getElementById('ni-price').value=''; });
}

function delItem(hotelId, key) {
  if (!confirm('Ürün silinsin mi?')) return;
  db.ref('hotels/'+hotelId+'/menu/'+key).remove().then(function(){ loadMenuEditor(); });
}

/* ── CREATE HOTEL ── */
async function createHotel() {
  var id = document.getElementById('new-id').value.trim().toLowerCase().replace(/\s+/g,'-');
  var name = document.getElementById('new-name').value.trim();
  var city = document.getElementById('new-city').value.trim();
  var roomStr = document.getElementById('new-rooms').value.trim();
  var sm = document.getElementById('status-msg');

  if (!id || !name || !roomStr) { sm.className='err'; sm.textContent='Tüm alanları doldurun'; return; }
  sm.className=''; sm.textContent=''; sm.style.display='none';

  var roomList = roomStr.split(',').map(function(r){ return r.trim(); }).filter(Boolean);
  var rooms = {};
  roomList.forEach(function(r){ rooms[r] = { active: true }; });

  try {
    await db.ref('hotels/'+id+'/info').set({ name, city, rooms });
    sm.className='ok'; sm.textContent='Bilgiler kaydedildi. Menü yükleniyor...';

    var menu = getFullMenu();
    for (var i=0; i<menu.length; i++) {
      await db.ref('hotels/'+id+'/menu').push(menu[i]);
    }
    sm.textContent = '✅ Otel ve menü başarıyla oluşturuldu!';
    document.getElementById('new-id').value='';
    document.getElementById('new-name').value='';
    document.getElementById('new-city').value='';
    document.getElementById('new-rooms').value='';
  } catch(e) {
    console.error(e);
    sm.className='err'; sm.textContent='Hata: '+e.message;
  }
}
