<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resepsiyon — e-Misafir</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f8f7f4;
  --bg2: #f0ede6;
  --card: #fff;
  --border: #e4ddd3;
  --gold: #b8913f;
  --gold2: #d4a853;
  --dark: #1c1917;
  --mid: #78716c;
  --light: #a8a29e;
  --green: #16a34a;
  --red: #dc2626;
  --blue: #2563eb;
  --orange: #ea580c;
  --radius: 10px;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
}
html { height: 100dvh; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--dark);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── HEADER ── */
#header {
  background: var(--dark);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.h-title { color: #fff; font-size: .95rem; font-weight: 700; }
.h-sub { color: var(--gold2); font-size: .7rem; margin-top: 1px; }
.h-live {
  margin-left: auto;
  background: rgba(74,222,128,.15);
  border: 1px solid rgba(74,222,128,.4);
  border-radius: 20px;
  padding: 3px 10px;
  font-size: .65rem;
  color: #4ade80;
  display: flex;
  align-items: center;
  gap: 5px;
}
.live-dot {
  width: 6px; height: 6px;
  background: #4ade80;
  border-radius: 50%;
  animation: blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── MAIN LAYOUT ── */
#main {
  display: flex;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}

/* ── SIDEBAR ── */
#sidebar {
  width: 220px;
  background: var(--card);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}
#sidebar-header {
  padding: 10px 12px;
  border-bottom: 1px solid var(--border);
  font-size: .72rem;
  font-weight: 700;
  color: var(--mid);
  letter-spacing: .5px;
  text-transform: uppercase;
}
#room-list {
  flex: 1;
  overflow-y: auto;
}
.room-item {
  padding: 10px 12px;
  border-bottom: 1px solid var(--bg2);
  cursor: pointer;
  position: relative;
  -webkit-tap-highlight-color: transparent;
  transition: background .1s;
}
.room-item:hover { background: var(--bg); }
.room-item.active { background: #fff8ec; border-left: 3px solid var(--gold); }
.ri-top { display: flex; align-items: center; justify-content: space-between; }
.ri-room { font-size: .82rem; font-weight: 700; }
.ri-badge {
  width: 9px; height: 9px;
  background: var(--red);
  border-radius: 50%;
  display: none;
}
.ri-badge.show { display: block; }
.ri-preview {
  font-size: .64rem;
  color: var(--light);
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  max-width: 160px;
}

/* ── RIGHT PANEL ── */
#panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

/* Panel tabs */
#ptabs {
  display: flex;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.ptab {
  flex: 1;
  border: none;
  background: none;
  padding: 10px 4px;
  font-family: var(--font);
  font-size: .7rem;
  color: var(--light);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  -webkit-tap-highlight-color: transparent;
}
.ptab.active { color: var(--dark); border-bottom-color: var(--gold); font-weight: 600; }

/* Panel screens */
.pscreen { display: none; flex-direction: column; flex: 1; overflow: hidden; min-height: 0; }
.pscreen.active { display: flex; }

/* ── ORDERS PANEL ── */
#order-list {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}
.order-card {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  padding: 12px;
  margin-bottom: 8px;
}
.oc-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.oc-no { font-size: .8rem; font-weight: 700; }
.oc-room { font-size: .68rem; color: var(--mid); }
.oc-time { font-size: .63rem; color: var(--light); }
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 10px;
  font-size: .63rem;
  font-weight: 600;
}
.s-pending  { background:#fef9c3; color:#854d0e; }
.s-confirmed{ background:#dbeafe; color:#1e40af; }
.s-preparing{ background:#fed7aa; color:#9a3412; }
.s-ready    { background:#dcfce7; color:#14532d; }
.s-delivered{ background:#f3f4f6; color:#6b7280; }

.oc-items { margin: 6px 0; }
.oc-item { font-size: .72rem; color: var(--mid); line-height: 1.6; }
.oc-total { font-size: .78rem; font-weight: 700; color: var(--dark); }
.oc-btns { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
.oc-btn {
  flex: 1;
  min-width: 80px;
  border: none;
  border-radius: 7px;
  padding: 7px 8px;
  font-size: .68rem;
  font-weight: 600;
  font-family: var(--font);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.oc-btn.confirm { background: var(--blue); color: #fff; }
.oc-btn.kitchen { background: var(--orange); color: #fff; }
.oc-btn.deliver { background: var(--green); color: #fff; }
.oc-btn.cancel  { background: #f3f4f6; color: var(--mid); }
.empty-state { text-align:center; padding:40px 20px; color:var(--light); font-size:.8rem; }

/* ── CHAT PANEL ── */
#chat-panel { display: none; flex-direction: column; flex: 1; overflow: hidden; min-height: 0; }
#chat-panel.active { display: flex; }

#chat-header {
  padding: 8px 12px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  font-size: .75rem;
  font-weight: 600;
  flex-shrink: 0;
}
#msg-list {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  background: var(--bg);
}
.no-room { text-align:center; padding:30px; color:var(--light); font-size:.78rem; }

.msg-row { display: flex; gap: 6px; align-items: flex-end; }
.msg-row.sent { flex-direction: row-reverse; }
.msg-avatar {
  width: 24px; height: 24px;
  border-radius: 50%;
  background: var(--bg2);
  font-size: .6rem;
  color: var(--mid);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border: 1px solid var(--border);
}
.msg-body { max-width: 78%; }
.msg-bubble {
  padding: 7px 11px;
  border-radius: 14px 14px 14px 3px;
  background: var(--card);
  color: var(--dark);
  font-size: .78rem;
  line-height: 1.4;
  border: 1px solid var(--border);
  word-break: break-word;
}
.sent .msg-bubble {
  background: var(--dark);
  color: #fff;
  border-color: transparent;
  border-radius: 14px 14px 3px 14px;
}
.msg-time { font-size: .55rem; color: var(--light); margin-top: 2px; }
.sent .msg-time { text-align: right; }

#chat-input-wrap {
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 8px 10px;
  display: flex;
  gap: 6px;
  align-items: flex-end;
  flex-shrink: 0;
}
#chat-input {
  flex: 1;
  background: var(--bg2);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 7px 12px;
  font-size: .78rem;
  font-family: var(--font);
  color: var(--dark);
  outline: none;
  resize: none;
  min-height: 36px;
  max-height: 80px;
  line-height: 1.4;
}
#chat-send {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--dark);
  border: none;
  color: var(--gold2);
  font-size: .9rem;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div>
    <div class="h-title">🏨 Resepsiyon</div>
    <div class="h-sub" id="hotel-name">e-Misafir</div>
  </div>
  <div class="h-live"><span class="live-dot"></span>Canlı</div>
</div>

<div id="main">
  <!-- SIDEBAR: oda listesi -->
  <div id="sidebar">
    <div id="sidebar-header">Odalar</div>
    <div id="room-list">
      <div class="empty-state" style="padding:20px;font-size:.72rem">Yükleniyor...</div>
    </div>
  </div>

  <!-- PANEL -->
  <div id="panel">
    <div id="ptabs">
      <button type="button" class="ptab active" onclick="switchPtab('orders')">📋 Siparişler</button>
      <button type="button" class="ptab" onclick="switchPtab('chat')">💬 Chat</button>
    </div>

    <!-- Siparişler -->
    <div class="pscreen active" id="ps-orders">
      <div id="order-list">
        <div class="empty-state">Henüz sipariş yok</div>
      </div>
    </div>

    <!-- Chat -->
    <div class="pscreen" id="ps-chat">
      <div id="chat-header">
        <span id="active-room-label">— Oda seçin</span>
      </div>
      <div id="msg-list">
        <div class="no-room">Sol taraftan oda seçin</div>
      </div>
      <div id="chat-input-wrap">
        <textarea id="chat-input" placeholder="Yanıt yazın..." rows="1"
          oninput="autoResize(this)"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendReply()}"></textarea>
        <button type="button" id="chat-send" onclick="sendReply()">➤</button>
      </div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyAV06sT1lBDNjMIA2EpoTK5uSRn3-mVqz4",
  authDomain: "emisafir-56796.firebaseapp.com",
  databaseURL: "https://emisafir-56796-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "emisafir-56796"
});
var db = firebase.database();
var TS = firebase.database.ServerValue.TIMESTAMP;

var params = new URLSearchParams(location.search);
var HOTEL = params.get('hotel') || 'demo';

/* ── PANEL TABS ── */
var activePtab = 'orders';
function switchPtab(t) {
  activePtab = t;
  document.querySelectorAll('.ptab').forEach(function(el,i){ el.classList.remove('active'); });
  document.querySelectorAll('.pscreen').forEach(function(el){ el.classList.remove('active'); });
  var tabs = document.querySelectorAll('.ptab');
  if (t==='orders') tabs[0].classList.add('active');
  else tabs[1].classList.add('active');
  document.getElementById('ps-'+t).classList.add('active');
  if (t==='chat' && activeRoom) scrollMsgs();
}

/* ── HOTEL INFO ── */
db.ref('hotels/'+HOTEL+'/info/name').once('value', function(s){
  if (s.val()) document.getElementById('hotel-name').textContent = s.val();
});

/* ── ROOMS ── */
var rooms = [];
var roomMsgListeners = {}; // room → unsubscribe
var roomUnread = {};
var activeRoom = null;
var seenMsgs = {}; // roomNo → {key: true}

db.ref('hotels/'+HOTEL+'/info/rooms').once('value', function(snap) {
  var list = document.getElementById('room-list');
  list.innerHTML = '';
  if (!snap.exists()) {
    list.innerHTML = '<div class="empty-state">Oda bulunamadı</div>';
    return;
  }
  snap.forEach(function(c) {
    var no = c.key;
    rooms.push(no);
    roomUnread[no] = 0;
    seenMsgs[no] = {};
    var item = document.createElement('div');
    item.className = 'room-item';
    item.id = 'room-' + no;
    item.onclick = function() { selectRoom(no); };
    item.innerHTML =
      '<div class="ri-top">' +
        '<div class="ri-room">Oda ' + no + '</div>' +
        '<div class="ri-badge" id="badge-' + no + '"></div>' +
      '</div>' +
      '<div class="ri-preview" id="prev-' + no + '">—</div>';
    list.appendChild(item);
    listenRoom(no);
  });
});

function listenRoom(no) {
  var ref = db.ref('hotels/'+HOTEL+'/rooms/'+no+'/messages');
  ref.on('child_added', function(snap) {
    var key = snap.key;
    var v = snap.val();
    if (!seenMsgs[no]) seenMsgs[no] = {};

    // preview
    document.getElementById('prev-'+no).textContent = (v.text||'').slice(0,30);

    if (seenMsgs[no][key]) return;
    seenMsgs[no][key] = true;

    // unread
    if (v.sender === 'guest' && no !== activeRoom) {
      roomUnread[no] = (roomUnread[no]||0) + 1;
      document.getElementById('badge-'+no).classList.add('show');
      if (Notification.permission==='granted') {
        new Notification('Oda '+no+' — Yeni mesaj', { body: (v.text||'').slice(0,60) });
      }
    }

    // if this is the open room in chat, append message
    if (no === activeRoom && activePtab === 'chat') {
      appendChatMsg(v, key);
    }
  });
}

function selectRoom(no) {
  activeRoom = no;
  document.querySelectorAll('.room-item').forEach(function(el){ el.classList.remove('active'); });
  document.getElementById('room-'+no).classList.add('active');
  roomUnread[no] = 0;
  document.getElementById('badge-'+no).classList.remove('show');
  document.getElementById('active-room-label').textContent = 'Oda ' + no;
  loadChat(no);
  if (activePtab !== 'chat') switchPtab('chat');
}

var loadedRooms = {};
function loadChat(no) {
  var list = document.getElementById('msg-list');
  list.innerHTML = '';
  seenMsgs[no] = {};

  db.ref('hotels/'+HOTEL+'/rooms/'+no+'/messages').once('value', function(snap) {
    if (!snap.exists()) {
      list.innerHTML = '<div class="no-room" style="font-size:.72rem">Henüz mesaj yok</div>';
      return;
    }
    snap.forEach(function(c) {
      seenMsgs[no][c.key] = true;
      appendChatMsg(c.val(), c.key);
    });
    scrollMsgs();
  });
}

function appendChatMsg(v, key) {
  var isSent = (v.sender === 'reception');
  var list = document.getElementById('msg-list');
  var d = document.createElement('div');
  d.className = 'msg-row' + (isSent ? ' sent' : '');
  d.dataset.key = key;
  var ts = v.time ? new Date(v.time) : new Date();
  var t = pad(ts.getHours())+':'+pad(ts.getMinutes());

  if (isSent) {
    d.innerHTML =
      '<div class="msg-body">' +
        '<div class="msg-bubble">' + esc(v.text).replace(/\n/g,'<br>') + '</div>' +
        '<div class="msg-time">' + t + '</div>' +
      '</div>';
  } else {
    d.innerHTML =
      '<div class="msg-avatar">' + (v.sender==='guest'?'👤':'🍽') + '</div>' +
      '<div class="msg-body">' +
        '<div class="msg-bubble">' + esc(v.text).replace(/\n/g,'<br>') + '</div>' +
        '<div class="msg-time">' + t + '</div>' +
      '</div>';
  }
  list.appendChild(d);
  scrollMsgs();
}

function scrollMsgs() {
  var el = document.getElementById('msg-list');
  el.scrollTop = el.scrollHeight;
}

function sendReply() {
  if (!activeRoom) return;
  var inp = document.getElementById('chat-input');
  var text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = '36px';

  var key = 'tmp-' + Date.now();
  seenMsgs[activeRoom][key] = true;
  appendChatMsg({ text: text, sender: 'reception', time: Date.now() }, key);

  db.ref('hotels/'+HOTEL+'/rooms/'+activeRoom+'/messages').push({
    text: text, sender: 'reception', time: TS
  }).then(function(ref){
    if (ref.key) seenMsgs[activeRoom][ref.key] = true;
  }).catch(function(e){ console.error(e); });
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 80) + 'px';
}

/* ── ORDERS ── */
var knownOrders = {};

db.ref('hotels/'+HOTEL+'/orders').on('child_added', function(snap) {
  var key = snap.key;
  var v = snap.val();
  if (knownOrders[key]) return;
  knownOrders[key] = v;
  renderOrder(key, v);
  if (v.status === 'pending') {
    if (Notification.permission==='granted')
      new Notification('Yeni Sipariş — Oda '+v.room, {body:'₺'+v.total+' tutarında sipariş'});
  }
});

db.ref('hotels/'+HOTEL+'/orders').on('child_changed', function(snap) {
  knownOrders[snap.key] = snap.val();
  rebuildOrders();
});

function rebuildOrders() {
  var list = document.getElementById('order-list');
  list.innerHTML = '';
  var keys = Object.keys(knownOrders);
  if (!keys.length) {
    list.innerHTML = '<div class="empty-state">Henüz sipariş yok</div>';
    return;
  }
  // sort by ts desc, delivered last
  keys.sort(function(a,b){
    var oa=knownOrders[a], ob=knownOrders[b];
    if (oa.status==='delivered' && ob.status!=='delivered') return 1;
    if (oa.status!=='delivered' && ob.status==='delivered') return -1;
    return (ob.ts||0)-(oa.ts||0);
  });
  keys.forEach(function(k){ renderOrder(k, knownOrders[k]); });
}

function renderOrder(key, v) {
  var list = document.getElementById('order-list');
  var existing = document.getElementById('oc-'+key);
  var card = document.createElement('div');
  card.className = 'order-card';
  card.id = 'oc-'+key;

  var statusMap = {
    pending:   { label:'Bekliyor',   cls:'s-pending' },
    confirmed: { label:'Onaylandı',  cls:'s-confirmed' },
    preparing: { label:'Hazırlanıyor',cls:'s-preparing'},
    ready:     { label:'Hazır',      cls:'s-ready' },
    delivered: { label:'Teslim',     cls:'s-delivered'}
  };
  var s = statusMap[v.status] || statusMap.pending;

  var itemsHtml = (v.items||[]).map(function(i){
    return '<div class="oc-item">' + (i.emoji||'') + ' ' + esc(i.name) + ' x' + i.qty + ' — ₺' + i.subtotal + '</div>';
  }).join('');

  var btnsHtml = '';
  if (v.status==='pending') {
    btnsHtml = '<button type="button" class="oc-btn confirm" onclick="updOrder(\''+key+'\',\'confirmed\')">✓ Onayla</button>' +
               '<button type="button" class="oc-btn cancel" onclick="updOrder(\''+key+'\',\'cancelled\')">İptal</button>';
  } else if (v.status==='confirmed') {
    btnsHtml = '<button type="button" class="oc-btn kitchen" onclick="updOrder(\''+key+'\',\'preparing\')">🍳 Mutfağa Gönder</button>';
  } else if (v.status==='ready') {
    btnsHtml = '<button type="button" class="oc-btn deliver" onclick="updOrder(\''+key+'\',\'delivered\')">✅ Teslim Edildi</button>';
  }

  card.innerHTML =
    '<div class="oc-top">' +
      '<div>' +
        '<div class="oc-no">' + esc(v.orderNo||key.slice(-6)) + '</div>' +
        '<div class="oc-room">Oda ' + esc(v.room||'?') + ' · ' + esc(v.time||'') + '</div>' +
      '</div>' +
      '<span class="status-pill ' + s.cls + '">' + s.label + '</span>' +
    '</div>' +
    '<div class="oc-items">' + itemsHtml + '</div>' +
    '<div class="oc-total">Toplam: ₺' + (v.total||0) + '</div>' +
    (btnsHtml ? '<div class="oc-btns">' + btnsHtml + '</div>' : '');

  if (existing) existing.replaceWith(card);
  else {
    // remove empty state
    var es = list.querySelector('.empty-state');
    if (es) es.remove();
    list.insertBefore(card, list.firstChild);
  }
}

function updOrder(key, status) {
  db.ref('hotels/'+HOTEL+'/orders/'+key+'/status').set(status).catch(function(e){ console.error(e); });
}

/* ── UTILS ── */
function pad(n){ return String(n).padStart(2,'0'); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// notification permission
if (Notification.permission === 'default') Notification.requestPermission();
</script>
</body>
</html>
