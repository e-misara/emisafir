<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>e-Misafir — Resepsiyon</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:sans-serif;background:#f5f5f5;height:100dvh;display:flex;flex-direction:column}
    #topbar{background:#1a1a2e;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
    .tb-logo{color:#c9a84c;font-size:.9rem;font-weight:700;letter-spacing:2px}
    .tb-hotel{color:rgba(255,255,255,.5);font-size:.7rem;margin-top:1px}
    .tb-clock{color:#fff;font-size:.95rem;font-weight:600;font-variant-numeric:tabular-nums}
    .tb-online{display:flex;align-items:center;gap:5px;font-size:.68rem;color:#4ade80}
    .odot{width:7px;height:7px;background:#4ade80;border-radius:50%;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

    #notif-bar{background:#c9a84c;color:#1a1a2e;padding:10px 20px;font-size:.82rem;font-weight:600;display:none;align-items:center;gap:8px;cursor:pointer;flex-shrink:0}
    #notif-bar.show{display:flex}

    #main-tabs{display:flex;background:#fff;border-bottom:1px solid #e5e5e5;flex-shrink:0}
    .mtab{flex:1;padding:12px 4px;border:none;background:none;font-size:.72rem;font-family:sans-serif;color:#9a8f80;cursor:pointer;border-bottom:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
    .mtab-icon{font-size:1rem}
    .mtab.active{color:#1a1a2e;border-bottom-color:#c9a84c;font-weight:600}
    .mbadge{background:#ef4444;color:#fff;border-radius:50%;width:16px;height:16px;font-size:.55rem;display:inline-flex;align-items:center;justify-content:center;margin-left:3px}

    .mscreen{display:none;flex:1;overflow-y:auto}
    .mscreen.active{display:flex;flex-direction:column}

    /* SİPARİŞ PANELİ */
    #orders-screen{padding:12px}
    .section-title{font-size:.65rem;color:#9a8f80;letter-spacing:1.5px;text-transform:uppercase;margin:16px 0 8px}
    .section-title:first-child{margin-top:0}

    .order-card{background:#fff;border-radius:10px;padding:14px;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.06);border-left:3px solid #e5e5e5}
    .order-card.new{border-left-color:#f59e0b}
    .order-card.confirmed{border-left-color:#3b82f6}
    .order-card.preparing{border-left-color:#8b5cf6}
    .order-card.ready{border-left-color:#10b981;animation:glow 1.5s ease-in-out infinite}
    @keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,.2)}50%{box-shadow:0 0 0 6px rgba(16,185,129,.1)}}
    .order-card.delivered{opacity:.5}

    .oc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
    .oc-room{font-size:.95rem;font-weight:700;color:#1a1a2e}
    .oc-time{font-size:.68rem;color:#9a8f80}
    .oc-no{font-size:.62rem;color:#bbb;margin-top:2px}

    .oc-items{margin-bottom:10px}
    .oc-item{display:flex;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #f5f5f5;font-size:.82rem}
    .oc-item:last-child{border:none}
    .oc-qty{color:#c9a84c;font-weight:700;min-width:20px}

    .oc-total{font-size:.82rem;color:#666;margin-bottom:10px}
    .oc-total strong{color:#1a1a2e;font-size:.9rem}

    .oc-status{display:inline-flex;align-items:center;gap:4px;font-size:.62rem;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:100px;margin-bottom:10px}
    .s-new{background:#fef3c7;color:#92400e;border:1px solid #fde68a}
    .s-confirmed{background:#dbeafe;color:#1e40af;border:1px solid #bfdbfe}
    .s-preparing{background:#ede9fe;color:#5b21b6;border:1px solid #ddd6fe}
    .s-ready{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
    .s-delivered{background:#f3f4f6;color:#6b7280;border:1px solid #d1d5db}

    .oc-actions{display:flex;gap:6px;flex-wrap:wrap}
    .oc-btn{border:none;border-radius:8px;padding:8px 14px;font-size:.75rem;font-weight:600;cursor:pointer;font-family:sans-serif}
    .btn-confirm{background:#1a1a2e;color:#c9a84c}
    .btn-deliver{background:#10b981;color:#fff}
    .btn-cancel{background:#fee2e2;color:#ef4444}

    /* CHAT */
    #chat-screen{padding:0;display:flex;flex-direction:column}
    #room-list-wrap{width:100%;background:#fff;border-bottom:1px solid #e5e5e5;overflow-x:auto;display:flex;padding:8px 12px;gap:8px;flex-shrink:0}
    .room-pill{background:#f5f5f5;border:1.5px solid #e5e5e5;border-radius:20px;padding:6px 14px;font-size:.75rem;cursor:pointer;white-space:nowrap;transition:all .15s;color:#666}
    .room-pill.active{background:#1a1a2e;color:#c9a84c;border-color:#1a1a2e}
    .room-pill .unread{display:inline-block;width:7px;height:7px;background:#ef4444;border-radius:50%;margin-left:4px;vertical-align:middle}

    #chat-msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:#f7f4ef}
    .msg{display:flex;gap:8px;align-items:flex-end}
    .msg.staff{flex-direction:row-reverse}
    .msg-ava{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.65rem;flex-shrink:0}
    .ava-guest{background:#f0ebe1;border:1px solid #e8dfd4}
    .ava-staff{background:#1a1a2e;color:#c9a84c}
    .bubble{max-width:75%;padding:8px 12px;font-size:.82rem;line-height:1.5;border-radius:14px 14px 14px 4px;background:#fff;border:1px solid rgba(0,0,0,.06);box-shadow:0 1px 3px rgba(0,0,0,.04)}
    .msg.staff .bubble{background:#1a1a2e;color:#fff;border-radius:14px 14px 4px 14px;border-color:transparent}
    .msg-time{font-size:.58rem;color:#9a8f80;margin-top:2px}
    .msg.staff .msg-time{text-align:right}

    #quick-replies{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 12px;background:#fff;border-top:1px solid #e5e5e5;flex-shrink:0}
    .qr-chip{background:#f5f5f5;border:1px solid #e5e5e5;border-radius:14px;padding:5px 10px;font-size:.7rem;cursor:pointer;white-space:nowrap;font-family:sans-serif;color:#333}
    .qr-chip:hover{background:#1a1a2e;color:#c9a84c;border-color:#1a1a2e}

    #chat-input-area{background:#fff;border-top:1px solid #e5e5e5;padding:10px 12px 14px;display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
    #chat-inp{flex:1;background:#f5f5f5;border:1.5px solid #e5e5e5;border-radius:18px;padding:8px 14px;font-size:.82rem;color:#333;outline:none;resize:none;min-height:36px;line-height:1.4;font-family:sans-serif}
    #chat-send{width:36px;height:36px;border-radius:50%;background:#1a1a2e;border:none;color:#c9a84c;font-size:.85rem;cursor:pointer;flex-shrink:0}

    /* MUTFAK İLETİŞİM */
    #kitchen-screen{padding:12px;display:flex;flex-direction:column;height:100%}
    #k-msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding-bottom:8px}
    #k-input-row{display:flex;gap:8px;align-items:flex-end;padding-top:10px;border-top:1px solid #e5e5e5;margin-top:auto}
    #k-inp{flex:1;background:#f5f5f5;border:1.5px solid #e5e5e5;border-radius:18px;padding:8px 14px;font-size:.82rem;color:#333;outline:none;resize:none;min-height:36px;font-family:sans-serif}
    #k-send{width:36px;height:36px;border-radius:50%;background:#8b5cf6;border:none;color:#fff;font-size:.85rem;cursor:pointer}

    /* MUHASEBE */
    #report-screen{padding:12px}
    .report-card{background:#fff;border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
    .rc-title{font-size:.72rem;color:#9a8f80;letter-spacing:1px;margin-bottom:4px}
    .rc-value{font-size:1.4rem;font-weight:700;color:#1a1a2e}
    .rc-sub{font-size:.72rem;color:#bbb;margin-top:2px}
    .report-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
    .report-table{background:#fff;border-radius:10px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
    .rt-head{display:flex;justify-content:space-between;font-size:.65rem;color:#9a8f80;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
    .rt-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f5;font-size:.82rem}
    .rt-row:last-child{border:none}
    .rt-room{font-weight:600;color:#1a1a2e}
    .rt-status{font-size:.65rem;padding:2px 7px;border-radius:10px}
    .rt-amount{font-weight:600;color:#c9a84c}
  </style>
</head>
<body>

<div id="topbar">
  <div>
    <div class="tb-logo">e-MİSAFİR</div>
    <div class="tb-hotel" id="tb-hotel">Resepsiyon Paneli</div>
  </div>
  <div style="text-align:right">
    <div class="tb-clock" id="tb-clock">--:--</div>
    <div class="tb-online"><span class="odot"></span>Çevrimiçi</div>
  </div>
</div>

<div id="notif-bar" onclick="this.classList.remove('show')">
  🔔 <span id="notif-text">Yeni bildirim</span>
</div>

<div id="main-tabs">
  <button class="mtab active" onclick="switchTab('orders',this)"><span class="mtab-icon">🍽</span>Siparişler<span class="mbadge" id="badge-orders">0</span></button>
  <button class="mtab" onclick="switchTab('chat',this)"><span class="mtab-icon">💬</span>Chat</button>
  <button class="mtab" onclick="switchTab('kitchen',this)"><span class="mtab-icon">👨‍🍳</span>Mutfak</button>
  <button class="mtab" onclick="switchTab('report',this)"><span class="mtab-icon">📊</span>Rapor</button>
</div>

<!-- SİPARİŞLER -->
<div id="orders-screen" class="mscreen active">
  <div class="section-title">Bekleyen Siparişler</div>
  <div id="pending-orders"></div>
  <div class="section-title">Aktif Siparişler</div>
  <div id="active-orders"></div>
  <div class="section-title">Tamamlananlar (Bugün)</div>
  <div id="done-orders"></div>
</div>

<!-- CHAT -->
<div id="chat-screen" class="mscreen">
  <div id="room-list-wrap"></div>
  <div id="chat-msgs"></div>
  <div id="quick-replies">
    <button class="qr-chip" onclick="setInp('✓ Talebiniz alındı, en kısa sürede ilgileniyoruz.')">✓ Alındı</button>
    <button class="qr-chip" onclick="setInp('Siparişiniz yaklaşık 20 dakika içinde odanıza gelecektir.')">🍽 20 dk</button>
    <button class="qr-chip" onclick="setInp('Temizlik ekibimiz kısa süre içinde odanıza gelecek.')">🧹 Temizlik</button>
    <button class="qr-chip" onclick="setInp('Check-out saatimiz 12:00\'dir.')">🔑 12:00</button>
    <button class="qr-chip" onclick="setInp('WiFi: eMisafir2025')">📶 WiFi</button>
    <button class="qr-chip" onclick="setInp('Taksiniz 10 dakika içinde hazır olacak.')">🚕 Taksi</button>
  </div>
  <div id="chat-input-area">
    <textarea id="chat-inp" placeholder="Misafire yanıt yaz..." rows="1"
      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea>
    <button id="chat-send" onclick="sendChat()">➤</button>
  </div>
</div>

<!-- MUTFAK -->
<div id="kitchen-screen" class="mscreen">
  <div id="k-msgs"></div>
  <div id="k-input-row">
    <textarea id="k-inp" placeholder="Mutfağa mesaj yaz..." rows="1"
      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px'"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendKitchen()}"></textarea>
    <button id="k-send" onclick="sendKitchen()">➤</button>
  </div>
</div>

<!-- RAPOR -->
<div id="report-screen" class="mscreen">
  <div class="report-grid">
    <div class="report-card">
      <div class="rc-title">BUGÜN CİRO</div>
      <div class="rc-value" id="today-revenue">₺0</div>
      <div class="rc-sub" id="today-count">0 sipariş</div>
    </div>
    <div class="report-card">
      <div class="rc-title">ORTALAMA SİPARİŞ</div>
      <div class="rc-value" id="avg-order">₺0</div>
      <div class="rc-sub">Kişi başı</div>
    </div>
  </div>
  <div class="report-table">
    <div class="rt-head"><span>ODA</span><span>TUTAR</span><span>DURUM</span></div>
    <div id="report-rows"></div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, update, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAV06sT1lBDNjMIA2EpoTK5uSRn3-mVqz4",
  authDomain: "emisafir-56796.firebaseapp.com",
  databaseURL: "https://emisafir-56796-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "emisafir-56796",
  storageBucket: "emisafir-56796.firebasestorage.app",
  messagingSenderId: "1044463772299",
  appId: "1:1044463772299:web:4f1496b541a433fe766a8e"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const hotel = new URLSearchParams(location.search).get('hotel') || 'demo';

// Saat
setInterval(() => {
  const n = new Date();
  document.getElementById('tb-clock').textContent =
    String(n.getHours()).padStart(2,'0') + ':' + String(n.getMinutes()).padStart(2,'0');
}, 1000);

function fmtTime() {
  return new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
}

function showNotif(text) {
  document.getElementById('notif-text').textContent = text;
  document.getElementById('notif-bar').classList.add('show');
  setTimeout(() => document.getElementById('notif-bar').classList.remove('show'), 5000);
  if (Notification.permission === 'granted') new Notification('e-Misafir', { body: text });
}

// TAB
window.switchTab = function(name, btn) {
  document.querySelectorAll('.mtab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.mscreen').forEach(s => s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(name + '-screen').classList.add('active');
}

// ── SİPARİŞLER ──
const STATUS_MAP = {
  pending: {label:'Onay Bekliyor', cls:'s-new'},
  confirmed: {label:'Onaylandı', cls:'s-confirmed'},
  preparing: {label:'Hazırlanıyor', cls:'s-preparing'},
  ready: {label:'Hazır!', cls:'s-ready'},
  delivered: {label:'Teslim Edildi', cls:'s-delivered'}
};

let prevOrders = {};

onValue(ref(db, `hotels/${hotel}/orders`), (snap) => {
  const allOrders = [];
  if (snap.exists()) {
    snap.forEach(c => allOrders.push({id: c.key, ...c.val()}));
  }
  allOrders.sort((a,b) => (b.ts||0) - (a.ts||0));

  const pending = allOrders.filter(o => o.status === 'pending');
  const active = allOrders.filter(o => ['confirmed','preparing','ready'].includes(o.status));
  const done = allOrders.filter(o => o.status === 'delivered');

  document.getElementById('badge-orders').textContent = pending.length + active.length;

  renderOrderList('pending-orders', pending);
  renderOrderList('active-orders', active);
  renderOrderList('done-orders', done);

  // Bildirim
  allOrders.forEach(o => {
    if (!prevOrders[o.id]) {
      if (o.status === 'pending') showNotif(`🍽 Yeni sipariş — Oda ${o.room} — ₺${o.total}`);
      if (o.status === 'ready') showNotif(`✅ Sipariş hazır — Oda ${o.room}`);
    }
  });
  prevOrders = Object.fromEntries(allOrders.map(o => [o.id, o.status]));

  // Rapor güncelle
  updateReport(allOrders);
});

function renderOrderList(containerId, orders) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (orders.length === 0) { el.innerHTML = ''; return; }
  el.innerHTML = '';
  orders.forEach(order => {
    const div = document.createElement('div');
    div.className = `order-card ${order.status === 'pending' ? 'new' : order.status}`;
    const sm = STATUS_MAP[order.status] || {label: order.status, cls: ''};

    let actions = '';
    if (order.status === 'pending') {
      actions = `<button class="oc-btn btn-confirm" onclick="confirmOrder('${order.id}')">✓ Onayla & Mutfağa İlet</button>
                 <button class="oc-btn btn-cancel" onclick="cancelOrder('${order.id}')">İptal</button>`;
    } else if (order.status === 'ready') {
      actions = `<button class="oc-btn btn-deliver" onclick="deliverOrder('${order.id}')">🚀 Teslim Edildi</button>`;
    }

    div.innerHTML = `
      <div class="oc-head">
        <div><div class="oc-room">Oda ${order.room}</div><div class="oc-no">${order.orderNo}</div></div>
        <div class="oc-time">${order.time || ''}</div>
      </div>
      <div class="oc-items">
        ${(order.items||[]).map(i=>`<div class="oc-item"><span>${i.emoji} ${i.name}</span><span class="oc-qty">x${i.qty} — ₺${i.subtotal}</span></div>`).join('')}
      </div>
      <div class="oc-total">Toplam: <strong>₺${order.total}</strong></div>
      <span class="oc-status ${sm.cls}">${sm.label}</span>
      <div class="oc-actions">${actions}</div>`;
    el.appendChild(div);
  });
}

window.confirmOrder = async function(id) {
  await update(ref(db, `hotels/${hotel}/orders/${id}`), { status: 'confirmed' });
  await push(ref(db, `hotels/${hotel}/kitchen-messages`), {
    text: `🍽 Yeni sipariş mutfağa iletildi.`, from: 'reception', ts: serverTimestamp()
  });
}

window.cancelOrder = async function(id) {
  if (!confirm('Siparişi iptal et?')) return;
  await update(ref(db, `hotels/${hotel}/orders/${id}`), { status: 'cancelled' });
}

window.deliverOrder = async function(id) {
  await update(ref(db, `hotels/${hotel}/orders/${id}`), { status: 'delivered', deliveredAt: fmtTime() });
}

// ── CHAT ──
const ROOMS = ['101','102','103','201','202','301','302'];
let activeRoom = ROOMS[0];
const roomMsgs = {};
const seenChat = new Set();

const roomWrap = document.getElementById('room-list-wrap');
ROOMS.forEach(r => {
  roomMsgs[r] = [];
  const pill = document.createElement('button');
  pill.className = 'room-pill' + (r === activeRoom ? ' active' : '');
  pill.id = 'pill-' + r;
  pill.innerHTML = r;
  pill.onclick = () => {
    activeRoom = r;
    document.querySelectorAll('.room-pill').forEach(p => p.classList.remove('active'));
    pill.classList.add('active');
    const up = pill.querySelector('.unread');
    if (up) up.remove();
    renderChatMsgs();
  };
  roomWrap.appendChild(pill);

  onValue(ref(db, `hotels/${hotel}/rooms/${r}/messages`), (snap) => {
    roomMsgs[r] = [];
    if (snap.exists()) snap.forEach(c => roomMsgs[r].push({key: c.key, ...c.val()}));
    if (r === activeRoom) renderChatMsgs();
    else {
      const last = roomMsgs[r][roomMsgs[r].length - 1];
      if (last && last.from === 'guest' && !seenChat.has(last.key)) {
        const p = document.getElementById('pill-' + r);
        if (p && !p.querySelector('.unread')) {
          const dot = document.createElement('span');
          dot.className = 'unread';
          p.appendChild(dot);
        }
        showNotif(`💬 Oda ${r}: ${last.text.slice(0,40)}`);
      }
    }
    if (last) seenChat.add(last.key);
  });
});

function renderChatMsgs() {
  const el = document.getElementById('chat-msgs');
  el.innerHTML = '';
  roomMsgs[activeRoom].forEach(m => {
    const isStaff = m.from === 'reception';
    const div = document.createElement('div');
    div.className = `msg ${isStaff ? 'staff' : ''}`;
    div.innerHTML = `
      <div class="msg-ava ${isStaff ? 'ava-staff' : 'ava-guest'}">${isStaff ? 'R' : '👤'}</div>
      <div>
        <div class="bubble">${m.text.replace(/\n/g,'<br>')}</div>
        <div class="msg-time">${fmtTime()}</div>
      </div>`;
    el.appendChild(div);
  });
  el.scrollTop = el.scrollHeight;
}

window.sendChat = async function() {
  const inp = document.getElementById('chat-inp');
  const text = inp.value.trim();
  if (!text || !activeRoom) return;
  inp.value = ''; inp.style.height = '36px';
  await push(ref(db, `hotels/${hotel}/rooms/${activeRoom}/messages`), {
    text, from: 'reception', ts: serverTimestamp()
  });
}

window.setInp = function(text) {
  document.getElementById('chat-inp').value = text;
  document.getElementById('chat-inp').focus();
}

// ── MUTFAK MESAJLAŞMA ──
const seenKitchen = new Set();
onValue(ref(db, `hotels/${hotel}/kitchen-messages`), (snap) => {
  const el = document.getElementById('k-msgs');
  if (!snap.exists()) return;
  snap.forEach(c => {
    if (seenKitchen.has(c.key)) return;
    seenKitchen.add(c.key);
    const d = c.val();
    const isReception = d.from === 'reception';
    const div = document.createElement('div');
    div.className = `msg ${isReception ? 'staff' : ''}`;
    div.innerHTML = `
      <div class="msg-ava ${isReception ? 'ava-staff' : ''}" style="${!isReception?'background:#8b5cf6;color:#fff':''}">
        ${isReception ? 'R' : '👨‍🍳'}
      </div>
      <div>
        <div class="bubble">${d.text}</div>
        <div class="msg-time">${fmtTime()}</div>
      </div>`;
    el.appendChild(div);
    el.scrollTop = el.scrollHeight;
    if (!isReception) showNotif(`👨‍🍳 Mutfak: ${d.text.slice(0,40)}`);
  });
});

window.sendKitchen = async function() {
  const inp = document.getElementById('k-inp');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = '36px';
  await push(ref(db, `hotels/${hotel}/kitchen-messages`), {
    text, from: 'reception', ts: serverTimestamp()
  });
}

// ── RAPOR ──
function updateReport(orders) {
  const today = new Date().toLocaleDateString('tr-TR');
  const todayOrders = orders.filter(o => o.date === today && o.status !== 'cancelled');
  const revenue = todayOrders.reduce((s,o) => s + (o.total||0), 0);
  const avg = todayOrders.length ? Math.round(revenue / todayOrders.length) : 0;

  document.getElementById('today-revenue').textContent = '₺' + revenue;
  document.getElementById('today-count').textContent = todayOrders.length + ' sipariş';
  document.getElementById('avg-order').textContent = '₺' + avg;

  const rows = document.getElementById('report-rows');
  rows.innerHTML = '';
  todayOrders.slice(0, 20).forEach(o => {
    const sm = STATUS_MAP[o.status] || {label: o.status, cls: ''};
    const row = document.createElement('div');
    row.className = 'rt-row';
    row.innerHTML = `
      <span class="rt-room">Oda ${o.room}</span>
      <span class="rt-amount">₺${o.total}</span>
      <span class="rt-status ${sm.cls}" style="font-size:.6rem;padding:2px 6px;border-radius:8px">${sm.label}</span>`;
    rows.appendChild(row);
  });
}

if (Notification.permission === 'default') Notification.requestPermission();
