<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>e-Misafir — Mutfak Paneli</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:sans-serif;background:#0f0f0f;color:#fff;min-height:100vh}
    #header{background:#1a1a1a;padding:16px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2a2a2a}
    .h-logo{font-size:1rem;font-weight:700;color:#c9a84c;letter-spacing:2px}
    .h-hotel{font-size:.75rem;color:#666;margin-top:2px}
    .h-clock{font-size:1.1rem;font-weight:600;color:#fff;font-variant-numeric:tabular-nums}
    .h-status{display:flex;align-items:center;gap:6px;font-size:.72rem;color:#4ade80}
    .status-dot{width:8px;height:8px;background:#4ade80;border-radius:50%;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

    #notif-bar{background:#c9a84c;color:#1a1a2e;padding:10px 24px;font-size:.82rem;font-weight:600;display:none;align-items:center;gap:8px;cursor:pointer}
    #notif-bar.show{display:flex}

    #tabs{display:flex;background:#1a1a1a;border-bottom:1px solid #2a2a2a}
    .ktab{flex:1;padding:14px 8px;border:none;background:none;color:#666;font-size:.78rem;font-family:sans-serif;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
    .ktab.active{color:#c9a84c;border-bottom-color:#c9a84c}
    .kbadge{background:#ef4444;color:#fff;border-radius:50%;width:18px;height:18px;font-size:.6rem;display:inline-flex;align-items:center;justify-content:center;margin-left:4px;vertical-align:middle}

    .kscreen{display:none;padding:16px}
    .kscreen.active{display:block}

    /* ORDER CARDS */
    .order-card{background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:16px;margin-bottom:12px;transition:border-color .2s}
    .order-card.pending{border-left:3px solid #f59e0b}
    .order-card.confirmed{border-left:3px solid #3b82f6}
    .order-card.preparing{border-left:3px solid #8b5cf6}
    .order-card.ready{border-left:3px solid #10b981}
    .order-card.delivered{border-left:3px solid #374151;opacity:.6}

    .oc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    .oc-room{font-size:1rem;font-weight:700;color:#fff}
    .oc-time{font-size:.7rem;color:#666}
    .oc-no{font-size:.65rem;color:#444;margin-top:2px}

    .oc-items{margin-bottom:12px}
    .oc-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #222}
    .oc-item:last-child{border-bottom:none}
    .oc-item-emoji{font-size:1.2rem}
    .oc-item-name{font-size:.85rem;color:#ddd;flex:1}
    .oc-item-qty{font-size:.85rem;font-weight:700;color:#c9a84c}

    .oc-total{font-size:.82rem;color:#888;margin-bottom:12px}
    .oc-total span{color:#c9a84c;font-weight:700}

    .oc-status{display:inline-flex;align-items:center;gap:4px;font-size:.65rem;letter-spacing:1px;text-transform:uppercase;padding:4px 10px;border-radius:100px;margin-bottom:12px}
    .s-pending{background:rgba(245,158,11,.15);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}
    .s-confirmed{background:rgba(59,130,246,.15);color:#3b82f6;border:1px solid rgba(59,130,246,.3)}
    .s-preparing{background:rgba(139,92,246,.15);color:#8b5cf6;border:1px solid rgba(139,92,246,.3)}
    .s-ready{background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.3)}
    .s-delivered{background:rgba(55,65,81,.3);color:#6b7280;border:1px solid rgba(55,65,81,.5)}

    .oc-actions{display:flex;gap:8px;flex-wrap:wrap}
    .oc-btn{border:none;border-radius:8px;padding:9px 16px;font-size:.78rem;font-weight:600;cursor:pointer;font-family:sans-serif;transition:opacity .2s}
    .oc-btn:hover{opacity:.85}
    .btn-start{background:#8b5cf6;color:#fff}
    .btn-ready{background:#10b981;color:#fff}
    .btn-note{background:#374151;color:#9ca3af}

    /* MESAJLAŞMA */
    #msg-area{display:flex;flex-direction:column;height:calc(100vh - 200px)}
    #msg-list{flex:1;overflow-y:auto;padding:8px 0}
    .kmsg{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px}
    .kmsg.mine{flex-direction:row-reverse}
    .kmsg-ava{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;flex-shrink:0}
    .ava-r{background:#1a1a2e;color:#c9a84c}
    .ava-k{background:#2d1a4e;color:#a78bfa}
    .kmsg-bubble{max-width:75%;padding:9px 13px;border-radius:16px;font-size:.83rem;line-height:1.5}
    .bubble-r{background:#1e2a3a;color:#fff;border-radius:16px 16px 16px 4px}
    .bubble-k{background:#2d1a4e;color:#fff;border-radius:16px 16px 4px 16px}
    .kmsg-time{font-size:.6rem;color:#555;margin-top:2px}
    .kmsg.mine .kmsg-time{text-align:right}
    #msg-input-row{display:flex;gap:8px;align-items:flex-end;padding:12px 0 0;border-top:1px solid #2a2a2a}
    #msg-inp{flex:1;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:12px;padding:10px 14px;font-size:.83rem;color:#fff;outline:none;resize:none;min-height:38px;line-height:1.4;font-family:sans-serif}
    #msg-inp::placeholder{color:#555}
    #msg-send{width:38px;height:38px;border-radius:50%;background:#c9a84c;border:none;color:#1a1a2e;font-size:.9rem;cursor:pointer;flex-shrink:0}

    .empty-k{text-align:center;padding:48px 20px;color:#444;font-size:.85rem}
  </style>
</head>
<body>

<div id="header">
  <div>
    <div class="h-logo">👨‍🍳 MUTFAK</div>
    <div class="h-hotel" id="h-hotel">Yükleniyor...</div>
  </div>
  <div style="text-align:right">
    <div class="h-clock" id="h-clock">--:--</div>
    <div class="h-status"><span class="status-dot"></span>Aktif</div>
  </div>
</div>

<div id="notif-bar" onclick="this.classList.remove('show')">
  🔔 <span id="notif-text">Yeni sipariş geldi!</span> — Tıklayarak kapat
</div>

<div id="tabs">
  <button class="ktab active" onclick="switchTab('bekleyen',this)">Bekleyen <span class="kbadge" id="badge-bekleyen">0</span></button>
  <button class="ktab" onclick="switchTab('hazirlanan',this)">Hazırlanan <span class="kbadge" id="badge-hazirlanan" style="background:#8b5cf6">0</span></button>
  <button class="ktab" onclick="switchTab('tamamlanan',this)">Tamamlanan</button>
  <button class="ktab" onclick="switchTab('mesajlar',this)">💬 Resepsiyon</button>
</div>

<div id="bekleyen-screen" class="kscreen active">
  <div id="bekleyen-list"></div>
</div>

<div id="hazirlanan-screen" class="kscreen">
  <div id="hazirlanan-list"></div>
</div>

<div id="tamamlanan-screen" class="kscreen">
  <div id="tamamlanan-list"></div>
</div>

<div id="mesajlar-screen" class="kscreen">
  <div id="msg-area">
    <div id="msg-list"></div>
    <div id="msg-input-row">
      <textarea id="msg-inp" placeholder="Resepsiyona mesaj yaz..." rows="1"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
      <button id="msg-send" onclick="sendMsg()">➤</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, update, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAV06sT1lBDNjMIA2EpoTK5uSRn3-mVqz4",
  authDomain: "emisafir-56796.firebaseapp.com",
  databaseURL: "https://emisafir-56796-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "emisafir-56796",
  storageBucket: "emisafir-56796.firebasestorage.app",
  messagingSenderId: "1044463772299",
  appId: "1:1044463772299:web:4f1496b541a433fe766a8e"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const hotel = new URLSearchParams(location.search).get('hotel') || 'demo';

// Saat
setInterval(() => {
  const now = new Date();
  document.getElementById('h-clock').textContent =
    String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
}, 1000);

// Otel adı
get(ref(db, `hotels/${hotel}/info`)).then(s => {
  if (s.exists()) document.getElementById('h-hotel').textContent = s.val().name || hotel;
});

function fmtTime() {
  return new Date().toLocaleTimeString('tr-TR', {hour:'2-digit', minute:'2-digit'});
}

const STATUS_LABELS = {
  pending: 'Onay Bekliyor',
  confirmed: 'Resepsiyon Onayladı',
  preparing: 'Hazırlanıyor',
  ready: 'Hazır — Servis Bekliyor',
  delivered: 'Teslim Edildi'
};

const STATUS_CLASS = {
  pending: 's-pending', confirmed: 's-confirmed',
  preparing: 's-preparing', ready: 's-ready', delivered: 's-delivered'
};

let prevOrderCount = 0;

// Siparişleri dinle
onValue(ref(db, `hotels/${hotel}/orders`), (snap) => {
  if (!snap.exists()) return;
  const orders = Object.entries(snap.val()).map(([id, v]) => ({id, ...v}));
  orders.sort((a, b) => (b.ts || 0) - (a.ts || 0));

  const bekleyen = orders.filter(o => o.status === 'confirmed');
  const hazirlanan = orders.filter(o => o.status === 'preparing');
  const tamamlanan = orders.filter(o => o.status === 'ready' || o.status === 'delivered');

  document.getElementById('badge-bekleyen').textContent = bekleyen.length;
  document.getElementById('badge-hazirlanan').textContent = hazirlanan.length;

  renderOrders('bekleyen-list', bekleyen, 'kitchen');
  renderOrders('hazirlanan-list', hazirlanan, 'kitchen');
  renderOrders('tamamlanan-list', tamamlanan, 'kitchen');

  // Bildirim
  if (orders.length > prevOrderCount && prevOrderCount > 0) {
    const nb = document.getElementById('notif-bar');
    document.getElementById('notif-text').textContent = `Yeni sipariş — Oda ${orders[0].room}`;
    nb.classList.add('show');
    setTimeout(() => nb.classList.remove('show'), 6000);
    if (Notification.permission === 'granted') {
      new Notification('🍽 Yeni Sipariş', { body: `Oda ${orders[0].room} — ₺${orders[0].total}` });
    }
  }
  prevOrderCount = orders.length;
});

function renderOrders(containerId, orders, role) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (orders.length === 0) {
    el.innerHTML = '<div class="empty-k">Sipariş yok</div>';
    return;
  }
  el.innerHTML = '';
  orders.forEach(order => {
    const div = document.createElement('div');
    div.className = `order-card ${order.status}`;

    let actionsHtml = '';
    if (order.status === 'confirmed') {
      actionsHtml = `<button class="oc-btn btn-start" onclick="updateStatus('${order.id}','preparing')">👨‍🍳 Hazırlamaya Başla</button>`;
    } else if (order.status === 'preparing') {
      actionsHtml = `<button class="oc-btn btn-ready" onclick="updateStatus('${order.id}','ready')">✅ Hazır — Servise Gönder</button>`;
    }

    div.innerHTML = `
      <div class="oc-top">
        <div>
          <div class="oc-room">Oda ${order.room}</div>
          <div class="oc-no">${order.orderNo}</div>
        </div>
        <div class="oc-time">${order.time || ''}</div>
      </div>
      <div class="oc-items">
        ${(order.items||[]).map(i => `
          <div class="oc-item">
            <span class="oc-item-emoji">${i.emoji}</span>
            <span class="oc-item-name">${i.name}</span>
            <span class="oc-item-qty">x${i.qty}</span>
          </div>`).join('')}
      </div>
      <div class="oc-total">Toplam: <span>₺${order.total}</span></div>
      <span class="oc-status ${STATUS_CLASS[order.status]}">${STATUS_LABELS[order.status]}</span>
      <div class="oc-actions">${actionsHtml}</div>`;

    el.appendChild(div);
  });
}

window.updateStatus = async function(orderId, newStatus) {
  await update(ref(db, `hotels/${hotel}/orders/${orderId}`), { status: newStatus });
  // Resepsiyona mesaj gönder
  const msgs = {
    preparing: '👨‍🍳 Mutfak siparişi hazırlamaya başladı.',
    ready: '✅ Sipariş hazır! Servis yapılabilir.'
  };
  if (msgs[newStatus]) {
    await push(ref(db, `hotels/${hotel}/kitchen-messages`), {
      text: msgs[newStatus], from: 'kitchen', ts: serverTimestamp()
    });
  }
}

// Mesajlaşma
const seenMsgs = new Set();
onValue(ref(db, `hotels/${hotel}/kitchen-messages`), (snap) => {
  if (!snap.exists()) return;
  const list = document.getElementById('msg-list');
  snap.forEach(child => {
    if (seenMsgs.has(child.key)) return;
    seenMsgs.add(child.key);
    const d = child.val();
    const isKitchen = d.from === 'kitchen';
    const div = document.createElement('div');
    div.className = `kmsg ${isKitchen ? 'mine' : ''}`;
    div.innerHTML = `
      <div class="kmsg-ava ${isKitchen ? 'ava-k' : 'ava-r'}">${isKitchen ? 'M' : 'R'}</div>
      <div>
        <div class="kmsg-bubble ${isKitchen ? 'bubble-k' : 'bubble-r'}">${d.text}</div>
        <div class="kmsg-time">${fmtTime()}</div>
      </div>`;
    list.appendChild(div);
    list.scrollTop = list.scrollHeight;
  });
});

window.sendMsg = async function() {
  const inp = document.getElementById('msg-inp');
  const text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = '38px';
  await push(ref(db, `hotels/${hotel}/kitchen-messages`), {
    text, from: 'kitchen', ts: serverTimestamp()
  });
}

// Bildirim izni iste
if (Notification.permission === 'default') {
  Notification.requestPermission();
}

// Tab geçişi
window.switchTab = function(name, btn) {
  document.querySelectorAll('.ktab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.kscreen').forEach(s => s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById(name + '-screen').classList.add('active');
}
</script>
</body>
</html>
