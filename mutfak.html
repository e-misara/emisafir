<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mutfak — e-Misafir</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #1a1209;
  --bg2: #241a0e;
  --card: #2d2012;
  --border: #3d2e18;
  --gold: #d4a853;
  --gold2: #f0c868;
  --text: #f5ead8;
  --mid: #b8a88a;
  --light: #7a6a52;
  --green: #4ade80;
  --orange: #fb923c;
  --blue: #60a5fa;
  --red: #f87171;
  --radius: 14px;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
}
html { height: 100dvh; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── HEADER ── */
#header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.h-icon { font-size: 1.6rem; }
.h-title { font-size: 1.1rem; font-weight: 800; color: var(--gold2); }
.h-sub { font-size: .72rem; color: var(--mid); margin-top: 2px; }
#clock {
  margin-left: auto;
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--gold);
  font-variant-numeric: tabular-nums;
}

/* ── TABS ── */
#tabs {
  display: flex;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tab {
  flex: 1;
  border: none;
  background: none;
  font-family: var(--font);
  padding: 12px 4px;
  font-size: .78rem;
  color: var(--light);
  cursor: pointer;
  border-bottom: 3px solid transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  -webkit-tap-highlight-color: transparent;
  transition: color .2s;
  position: relative;
}
.tab .t-icon { font-size: 1.2rem; }
.tab.active { color: var(--gold2); border-bottom-color: var(--gold); }
.tab-count {
  position: absolute;
  top: 5px;
  right: calc(50% - 20px);
  background: var(--red);
  color: #fff;
  font-size: .6rem;
  font-weight: 700;
  min-width: 18px;
  height: 18px;
  border-radius: 9px;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 0 4px;
}
.tab-count.show { display: flex; }

/* ── SCREENS ── */
.screen { display: none; flex-direction: column; flex: 1; overflow: hidden; min-height: 0; }
.screen.active { display: flex; }
.order-grid {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
  align-content: start;
}

/* ── ORDER CARD ── */
.order-card {
  background: var(--card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  overflow: hidden;
}
.card-top {
  background: var(--bg2);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border);
}
.card-room { font-size: 1rem; font-weight: 800; color: var(--gold2); }
.card-time { font-size: .72rem; color: var(--mid); }
.card-no { font-size: .65rem; color: var(--light); margin-top: 2px; }
.order-card.new {
  border-color: var(--red);
  box-shadow: 0 0 0 2px rgba(248,113,113,.25);
  animation: pulse-new 1.5s ease-in-out 4;
  cursor: pointer;
}
@keyframes pulse-new {
  0%,100% { box-shadow: 0 0 0 2px rgba(248,113,113,.2); }
  50%      { box-shadow: 0 0 0 6px rgba(248,113,113,.45); }
}
.new-badge {
  background: var(--red);
  color: #fff;
  font-size: .6rem;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 8px;
  letter-spacing: .5px;
}
.timer-badge {
  background: rgba(251,146,60,.15);
  border: 1px solid rgba(251,146,60,.4);
  border-radius: 20px;
  padding: 3px 10px;
  font-size: .7rem;
  color: var(--orange);
  font-variant-numeric: tabular-nums;
}
.card-items { padding: 12px 14px; }
.card-item {
  font-size: .85rem;
  line-height: 1.7;
  color: var(--text);
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.card-item .qty {
  background: var(--gold);
  color: var(--bg);
  font-size: .65rem;
  font-weight: 800;
  padding: 1px 6px;
  border-radius: 6px;
  flex-shrink: 0;
}
.card-total {
  padding: 0 14px 10px;
  font-size: .78rem;
  color: var(--mid);
}
.card-btn {
  width: 100%;
  border: none;
  padding: 14px;
  font-size: .88rem;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background .15s;
}
.btn-start   { background: var(--orange); color: var(--bg); }
.btn-ready   { background: var(--green);  color: var(--bg); }
.btn-done    { background: var(--light);  color: var(--bg); cursor: default; }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--light);
  grid-column: 1/-1;
}
.empty-icon { font-size: 2.5rem; margin-bottom: 10px; }
.empty-text { font-size: .85rem; }

/* ── MESSAGES PANEL ── */
#s-msg {
  display: none;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}
#s-msg.active { display: flex; }
#kmsg-list {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 7px;
  background: var(--bg);
}
.msg-row { display: flex; gap: 8px; align-items: flex-end; }
.msg-row.sent { flex-direction: row-reverse; }
.msg-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--card);
  border: 1.5px solid var(--border);
  font-size: .72rem;
  color: var(--mid);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.msg-bubble {
  max-width: 76%;
  padding: 9px 13px;
  border-radius: 16px 16px 16px 3px;
  background: var(--card);
  color: var(--text);
  font-size: .85rem;
  line-height: 1.45;
  border: 1px solid var(--border);
  word-break: break-word;
}
.sent .msg-bubble {
  background: var(--gold);
  color: var(--bg);
  border-color: transparent;
  border-radius: 16px 16px 3px 16px;
}
.msg-time { font-size: .6rem; color: var(--light); margin-top: 3px; }
.sent .msg-time { text-align: right; }

#kinput-wrap {
  background: var(--bg2);
  border-top: 1px solid var(--border);
  padding: 10px 12px;
  display: flex;
  gap: 8px;
  align-items: flex-end;
  flex-shrink: 0;
}
#kinput {
  flex: 1;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 9px 13px;
  font-size: 1rem;
  font-family: var(--font);
  color: var(--text);
  outline: none;
  resize: none;
  min-height: 40px;
  max-height: 90px;
  line-height: 1.4;
}
#kinput::placeholder { color: var(--light); }
#ksend {
  width: 40px; height: 40px;
  border-radius: 50%;
  background: var(--gold);
  border: none;
  color: var(--bg);
  font-size: .95rem;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
</style>
</head>
<body>

<div id="header">
  <div class="h-icon">🍳</div>
  <div>
    <div class="h-title">Mutfak</div>
    <div class="h-sub">e-Misafir · Sipariş Takibi</div>
  </div>
  <div id="clock">--:--</div>
</div>

<div id="tabs">
  <button type="button" class="tab active" onclick="switchTab('waiting')">
    <span class="t-icon">⏳</span>Bekleyen
    <span class="tab-count" id="cnt-waiting"></span>
  </button>
  <button type="button" class="tab" onclick="switchTab('preparing')">
    <span class="t-icon">🔥</span>Hazırlanan
    <span class="tab-count" id="cnt-preparing"></span>
  </button>
  <button type="button" class="tab" onclick="switchTab('done')">
    <span class="t-icon">✅</span>Tamamlanan
  </button>
  <button type="button" class="tab" onclick="switchTab('msg')">
    <span class="t-icon">💬</span>Mesajlar
    <span class="tab-count" id="cnt-msg"></span>
  </button>
</div>

<div class="screen active" id="s-waiting">
  <div class="order-grid" id="grid-waiting">
    <div class="empty-state"><div class="empty-icon">✅</div><div class="empty-text">Bekleyen sipariş yok</div></div>
  </div>
</div>

<div class="screen" id="s-preparing">
  <div class="order-grid" id="grid-preparing">
    <div class="empty-state"><div class="empty-icon">🍽</div><div class="empty-text">Hazırlanan sipariş yok</div></div>
  </div>
</div>

<div class="screen" id="s-done">
  <div class="order-grid" id="grid-done">
    <div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">Tamamlanan sipariş yok</div></div>
  </div>
</div>

<div class="screen" id="s-msg">
  <div id="kmsg-list"></div>
  <div id="kinput-wrap">
    <textarea id="kinput" placeholder="Resepsiyona mesaj..." rows="1"
      oninput="autoResize(this)"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();kSend()}"></textarea>
    <button type="button" id="ksend" onclick="kSend()">➤</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyAV06sT1lBDNjMIA2EpoTK5uSRn3-mVqz4",
  authDomain: "emisafir-56796.firebaseapp.com",
  databaseURL: "https://emisafir-56796-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "emisafir-56796"
});
var db = firebase.database();
var TS = firebase.database.ServerValue.TIMESTAMP;

var params = new URLSearchParams(location.search);
var HOTEL = params.get('hotel') || 'demo';

/* ── CLOCK ── */
function tick() {
  var d = new Date();
  document.getElementById('clock').textContent = pad(d.getHours())+':'+pad(d.getMinutes());
}
tick(); setInterval(tick, 1000);

/* ── TABS ── */
var activeTab = 'waiting';
function switchTab(t) {
  activeTab = t;
  document.querySelectorAll('.tab').forEach(function(el){ el.classList.remove('active'); });
  document.querySelectorAll('.screen').forEach(function(el){ el.classList.remove('active'); });
  var tabOrder = ['waiting','preparing','done','msg'];
  document.querySelectorAll('.tab')[tabOrder.indexOf(t)].classList.add('active');
  document.getElementById('s-'+t).classList.add('active');
  if (t==='msg') { document.getElementById('cnt-msg').classList.remove('show'); scrollKmsgs(); }
}

/* ── ORDERS ── */
var orders = {};        // key → data
var timers = {};        // key → startTime
var newOrders = {};     // key → true (yeni, görülmemiş)
var knownStatuses = {}; // key → son bilinen status

db.ref('hotels/'+HOTEL+'/orders').on('child_added', function(snap) {
  var key = snap.key;
  var v = snap.val();
  knownStatuses[key] = v.status;
  orders[key] = v;
  // Mutfağa yeni gelen (confirmed) siparişi işaretle
  if (v.status === 'confirmed' && v.isNew !== false) {
    newOrders[key] = true;
  }
  rebuildGrids();
});

db.ref('hotels/'+HOTEL+'/orders').on('child_changed', function(snap) {
  var key = snap.key;
  var v = snap.val();
  var prev = knownStatuses[key];
  knownStatuses[key] = v.status;
  orders[key] = v;
  // Resepsiyondan onaylanıp mutfağa yeni düştüyse işaretle
  if (v.status === 'confirmed' && prev !== 'confirmed' && v.isNew !== false) {
    newOrders[key] = true;
  }
  // Firebase'de isNew false yapıldıysa temizle
  if (v.isNew === false) delete newOrders[key];
  rebuildGrids();
});

function rebuildGrids() {
  var waiting = [], preparing = [], done = [];
  Object.entries(orders).forEach(function(pair) {
    var k=pair[0], v=pair[1];
    if (v.status === 'confirmed') waiting.push({k,v});
    else if (v.status === 'preparing') preparing.push({k,v});
    else if (v.status === 'ready' || v.status === 'delivered') done.push({k,v});
  });

  // sort by ts asc (oldest first for kitchen)
  function byTs(a,b){ return (a.v.ts||0)-(b.v.ts||0); }
  waiting.sort(byTs); preparing.sort(byTs);

  fillGrid('grid-waiting', waiting, 'waiting');
  fillGrid('grid-preparing', preparing, 'preparing');
  fillGrid('grid-done', done, 'done');

  updateCount('cnt-waiting', waiting.length);
  updateCount('cnt-preparing', preparing.length);
}

function updateCount(id, n) {
  var el = document.getElementById(id);
  if (n > 0) { el.textContent = n; el.classList.add('show'); }
  else { el.classList.remove('show'); }
}

function fillGrid(gridId, list, type) {
  var grid = document.getElementById(gridId);
  grid.innerHTML = '';
  if (!list.length) {
    var msgs = { waiting:'Bekleyen sipariş yok', preparing:'Hazırlanan sipariş yok', done:'Tamamlanan sipariş yok' };
    var icons = { waiting:'✅', preparing:'🍽', done:'📋' };
    grid.innerHTML = '<div class="empty-state"><div class="empty-icon">'+(icons[type]||'📋')+'</div><div class="empty-text">'+(msgs[type]||'Sipariş yok')+'</div></div>';
    return;
  }
  list.forEach(function(o){ grid.appendChild(buildCard(o.k, o.v, type)); });
}

function clearNew(key, card) {
  if (!newOrders[key]) return;
  delete newOrders[key];
  card.classList.remove('new');
  card.onclick = null;
  db.ref('hotels/'+HOTEL+'/orders/'+key+'/isNew').set(false);
}

function buildCard(key, v, type) {
  var card = document.createElement('div');
  card.className = 'order-card' + (newOrders[key] ? ' new' : '');
  if (newOrders[key]) {
    card.onclick = function() { clearNew(key, card); };
  }

  var elapsed = '';
  if (v.ts) {
    var mins = Math.floor((Date.now() - v.ts) / 60000);
    elapsed = mins + ' dk';
  }

  var itemsHtml = (v.items||[]).map(function(i){
    return '<div class="card-item"><span class="qty">'+i.qty+'x</span>'+(i.emoji||'')+ ' '+esc(i.name)+'</div>';
  }).join('');

  var btnHtml = '';
  if (type === 'waiting') {
    btnHtml = '<button type="button" class="card-btn btn-start" onclick="updOrder(\''+key+'\',\'preparing\')">🔥 Hazırlamaya Başla</button>';
  } else if (type === 'preparing') {
    btnHtml = '<button type="button" class="card-btn btn-ready" onclick="updOrder(\''+key+'\',\'ready\')">✅ Hazır — Servise Gönder</button>';
  } else {
    var sl = v.status==='delivered' ? '✔ Teslim Edildi' : '✔ Hazır';
    btnHtml = '<button type="button" class="card-btn btn-done" disabled>'+sl+'</button>';
  }

  card.innerHTML =
    '<div class="card-top">' +
      '<div>' +
        '<div class="card-room">Oda '+esc(v.room||'?')+
          (newOrders[key] ? ' <span class="new-badge">YENİ</span>' : '') +
        '</div>' +
        '<div class="card-no">'+esc(v.orderNo||key.slice(-6))+'</div>' +
      '</div>' +
      '<div>' +
        '<div class="card-time">'+esc(v.time||'')+'</div>' +
        (elapsed ? '<div class="timer-badge">⏱ '+elapsed+'</div>' : '') +
      '</div>' +
    '</div>' +
    '<div class="card-items">'+itemsHtml+'</div>' +
    '<div class="card-total">Toplam: ₺'+(v.total||0)+'</div>' +
    btnHtml;

  return card;
}

function updOrder(key, status) {
  delete newOrders[key]; // YENİ badge'ini anında kaldır
  db.ref('hotels/'+HOTEL+'/orders/'+key).update({ status: status, isNew: false })
    .catch(function(e) {
      console.error('Sipariş güncellenemedi:', e);
      alert('❌ Sipariş durumu güncellenemedi.\nHata: ' + (e.message || e.code) + '\n\nFirebase kurallarınızı kontrol edin.');
    });
}

// Refresh timers every minute
setInterval(rebuildGrids, 60000);

/* ── KITCHEN MESSAGES ── */
var seenKmsgs = {};
var kUnread = 0;

db.ref('hotels/'+HOTEL+'/kitchen-messages').on('child_added', function(snap) {
  var key = snap.key;
  if (seenKmsgs[key]) return;
  seenKmsgs[key] = true;
  var v = snap.val();
  appendKmsg(v);
  if (v.sender !== 'kitchen' && activeTab !== 'msg') {
    kUnread++;
    var el = document.getElementById('cnt-msg');
    el.textContent = kUnread; el.classList.add('show');
  }
});

function appendKmsg(v) {
  var list = document.getElementById('kmsg-list');
  var isSent = v.sender === 'kitchen';
  var d = document.createElement('div');
  d.className = 'msg-row' + (isSent ? ' sent' : '');
  var ts = v.time ? new Date(v.time) : new Date();
  var t = pad(ts.getHours())+':'+pad(ts.getMinutes());
  if (isSent) {
    d.innerHTML = '<div class="msg-bubble">'+esc(v.text).replace(/\n/g,'<br>')+'<div class="msg-time">'+t+'</div></div>';
  } else {
    d.innerHTML =
      '<div class="msg-avatar">R</div>' +
      '<div><div class="msg-bubble">'+esc(v.text).replace(/\n/g,'<br>')+'</div><div class="msg-time">'+t+'</div></div>';
  }
  list.appendChild(d);
  scrollKmsgs();
}

function scrollKmsgs() {
  var el = document.getElementById('kmsg-list');
  el.scrollTop = el.scrollHeight;
}

var seenSentKmsgs = {};
function kSend() {
  var inp = document.getElementById('kinput');
  var text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = '40px';
  var tmpKey = 'tmp-'+Date.now();
  seenKmsgs[tmpKey] = true;
  appendKmsg({ text, sender:'kitchen', time: Date.now() });
  db.ref('hotels/'+HOTEL+'/kitchen-messages').push({
    text, sender:'kitchen', time: TS
  }).then(function(ref){ if(ref.key) seenKmsgs[ref.key]=true; });
}

function autoResize(el) {
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,90)+'px';
}

function pad(n){ return String(n).padStart(2,'0'); }
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
