<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>e-Misafir</title>
<style>
/* ── RESET & TOKENS ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #faf8f5;
  --bg2: #f2ede6;
  --card: #fff;
  --border: #e4ddd3;
  --gold: #b8913f;
  --gold2: #d4a853;
  --dark: #1c1917;
  --mid: #78716c;
  --light: #a8a29e;
  --green: #16a34a;
  --red: #dc2626;
  --radius: 12px;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

/* ── LAYOUT ── */
html { height: 100dvh; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--dark);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  max-width: 480px;
  margin: 0 auto;
}

/* ── HEADER ── */
#header {
  background: var(--dark);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.h-icon { font-size: 1.4rem; }
.h-info { flex: 1; }
.h-name { color: #fff; font-size: .9rem; font-weight: 700; }
.h-sub { color: var(--gold2); font-size: .7rem; margin-top: 1px; }
.h-room {
  background: rgba(184,145,63,.15);
  border: 1px solid rgba(184,145,63,.4);
  border-radius: 20px;
  padding: 4px 12px;
  color: var(--gold2);
  font-size: .72rem;
  font-weight: 600;
}

/* ── TABS ── */
#tabs {
  display: flex;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.tab {
  flex: 1;
  border: none;
  background: none;
  padding: 10px 4px 8px;
  font-family: var(--font);
  font-size: .65rem;
  color: var(--light);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  position: relative;
  -webkit-tap-highlight-color: transparent;
  transition: color .2s;
}
.tab .t-icon { font-size: 1.1rem; line-height: 1; }
.tab.active { color: var(--dark); border-bottom-color: var(--gold); font-weight: 600; }
.tab .badge {
  position: absolute;
  top: 6px;
  right: 50%;
  transform: translateX(8px);
  width: 8px; height: 8px;
  background: var(--red);
  border-radius: 50%;
  display: none;
}
.tab .badge.show { display: block; }

/* ── SCREENS ── */
.screen {
  display: none;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}
.screen.active { display: flex; }

/* ════════════════════════
   MENÜ SCREEN
════════════════════════ */
#s-menu {
  display: none;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}
#s-menu.active { display: flex; }

#cat-bar {
  display: flex;
  gap: 6px;
  padding: 8px 12px;
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#cat-bar::-webkit-scrollbar { display: none; }
.cat-btn {
  flex-shrink: 0;
  border: 1.5px solid var(--border);
  background: var(--bg);
  border-radius: 20px;
  padding: 5px 12px;
  font-size: .68rem;
  font-family: var(--font);
  color: var(--mid);
  cursor: pointer;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  transition: all .15s;
}
.cat-btn.active {
  background: var(--dark);
  border-color: var(--dark);
  color: var(--gold2);
}

#time-bar {
  padding: 5px 14px;
  font-size: .65rem;
  color: var(--mid);
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
}

#menu-list {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 10px 12px;
}

.cat-label {
  font-size: .62rem;
  font-weight: 700;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: var(--light);
  padding: 10px 0 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 6px;
}
.cat-label:first-child { padding-top: 2px; }

.menu-item {
  background: var(--card);
  border-radius: var(--radius);
  padding: 10px 10px 10px 12px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--border);
}
.mi-emoji { font-size: 1.6rem; flex-shrink: 0; line-height: 1; }
.mi-info { flex: 1; min-width: 0; }
.mi-name { font-size: .82rem; font-weight: 600; color: var(--dark); line-height: 1.3; }
.mi-desc { font-size: .65rem; color: var(--light); margin-top: 2px; line-height: 1.3; }
.mi-price { font-size: .8rem; font-weight: 700; color: var(--gold); margin-top: 3px; }
.mi-ctrl { flex-shrink: 0; }

.add-btn {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: var(--dark);
  border: none;
  color: var(--gold2);
  font-size: 1.4rem;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.qty-ctrl {
  display: flex;
  align-items: center;
  gap: 2px;
  background: var(--bg2);
  border-radius: 20px;
  padding: 2px;
}
.qty-ctrl button {
  width: 30px; height: 30px;
  border: none;
  background: none;
  font-size: 1.1rem;
  color: var(--dark);
  cursor: pointer;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.qty-ctrl span { font-size: .82rem; font-weight: 700; min-width: 18px; text-align: center; }

#cart-bar {
  background: var(--dark);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  border-top: 1px solid rgba(255,255,255,.1);
}
#cart-bar.hidden { display: none; }
.cart-info { color: rgba(255,255,255,.6); font-size: .7rem; }
.cart-total { color: var(--gold2); font-size: 1rem; font-weight: 700; }
#cart-btn {
  background: var(--gold);
  color: #fff;
  border: none;
  border-radius: 10px;
  padding: 10px 16px;
  font-size: .8rem;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

/* ── MODALS ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 100;
  align-items: flex-end;
  justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal-sheet {
  background: var(--card);
  border-radius: 20px 20px 0 0;
  padding: 20px 16px max(24px, env(safe-area-inset-bottom));
  width: 100%;
  max-width: 480px;
  max-height: 80dvh;
  overflow-y: auto;
}
.modal-title { font-size: .95rem; font-weight: 700; margin-bottom: 4px; }
.modal-sub { font-size: .68rem; color: var(--light); margin-bottom: 14px; }

.order-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--bg2);
}
.or-name { font-size: .8rem; font-weight: 500; }
.or-qty { font-size: .65rem; color: var(--light); }
.or-price { font-size: .82rem; font-weight: 700; }
.order-total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 2px solid var(--dark);
}
.ot-label { font-size: .8rem; font-weight: 600; }
.ot-val { font-size: 1.1rem; font-weight: 800; color: var(--gold); }

.order-note {
  background: var(--bg2);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: .68rem;
  color: var(--mid);
  line-height: 1.5;
  margin: 12px 0;
}

.modal-btns { display: flex; gap: 8px; margin-top: 4px; }
.btn-cancel {
  flex: 1;
  border: 1.5px solid var(--border);
  background: none;
  border-radius: 10px;
  padding: 12px;
  font-size: .78rem;
  font-family: var(--font);
  color: var(--mid);
  cursor: pointer;
}
.btn-confirm {
  flex: 2;
  border: none;
  background: var(--dark);
  color: var(--gold2);
  border-radius: 10px;
  padding: 12px;
  font-size: .8rem;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.btn-confirm:disabled { opacity: .4; }

/* success modal */
.modal-center { align-items: center; }
.modal-card {
  background: var(--card);
  border-radius: 20px;
  padding: 28px 20px;
  text-align: center;
  max-width: 300px;
  width: 90%;
}
.success-icon { font-size: 2.8rem; margin-bottom: 10px; }
.success-title { font-size: 1rem; font-weight: 700; margin-bottom: 6px; }
.success-sub { font-size: .72rem; color: var(--mid); line-height: 1.5; margin-bottom: 16px; }
.btn-ok {
  background: var(--dark);
  color: var(--gold2);
  border: none;
  border-radius: 10px;
  padding: 11px 24px;
  font-size: .82rem;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
}

/* ════════════════════════
   CHAT SCREEN
════════════════════════ */
#s-chat {
  display: none;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}
#s-chat.active { display: flex; }

#chat-status {
  background: #f0fdf4;
  border-bottom: 1px solid #bbf7d0;
  padding: 6px 14px;
  font-size: .66rem;
  color: var(--green);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.status-dot {
  width: 7px; height: 7px;
  background: #4ade80;
  border-radius: 50%;
  flex-shrink: 0;
  animation: blink 2s infinite;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

#msg-list {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--bg);
}

.msg-row { display: flex; gap: 8px; align-items: flex-end; }
.msg-row.sent { flex-direction: row-reverse; }
.msg-avatar {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--dark);
  border: 1.5px solid var(--gold);
  font-size: .65rem;
  color: var(--gold2);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.msg-body { max-width: 75%; }
.msg-bubble {
  padding: 8px 12px;
  border-radius: 16px 16px 16px 4px;
  background: var(--card);
  color: var(--dark);
  font-size: .8rem;
  line-height: 1.45;
  border: 1px solid var(--border);
  word-break: break-word;
}
.sent .msg-bubble {
  background: var(--dark);
  color: #fff;
  border-color: transparent;
  border-radius: 16px 16px 4px 16px;
}
.msg-time { font-size: .57rem; color: var(--light); margin-top: 3px; }
.sent .msg-time { text-align: right; }

#quick-chips {
  display: flex;
  gap: 5px;
  padding: 6px 12px;
  overflow-x: auto;
  scrollbar-width: none;
  background: var(--card);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
#quick-chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  border: 1px solid var(--border);
  background: var(--bg);
  border-radius: 14px;
  padding: 5px 10px;
  font-size: .65rem;
  font-family: var(--font);
  color: var(--dark);
  cursor: pointer;
  white-space: nowrap;
  min-height: 30px;
  display: flex;
  align-items: center;
  -webkit-tap-highlight-color: transparent;
}

#chat-input-wrap {
  background: var(--card);
  border-top: 1px solid var(--border);
  padding: 8px 12px;
  padding-bottom: max(8px, env(safe-area-inset-bottom));
  display: flex;
  gap: 8px;
  align-items: flex-end;
  flex-shrink: 0;
}
#chat-input {
  flex: 1;
  background: var(--bg2);
  border: 1.5px solid var(--border);
  border-radius: 18px;
  padding: 8px 12px;
  font-size: 16px;
  font-family: var(--font);
  color: var(--dark);
  outline: none;
  resize: none;
  min-height: 38px;
  max-height: 90px;
  line-height: 1.4;
  -webkit-appearance: none;
}
#chat-send {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: var(--dark);
  border: none;
  color: var(--gold2);
  font-size: 1rem;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-tap-highlight-color: transparent;
}

/* ════════════════════════
   TEMİZLİK SCREEN
════════════════════════ */
#s-clean {
  display: none;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
  min-height: 0;
}
#s-clean.active { display: flex; }

#clean-content {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px;
}
.clean-note {
  background: var(--bg2);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: .68rem;
  color: var(--mid);
  line-height: 1.5;
  margin-bottom: 10px;
}
.clean-opt {
  width: 100%;
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  text-align: left;
  font-family: var(--font);
  -webkit-tap-highlight-color: transparent;
  transition: border-color .15s, background .15s;
}
.clean-opt.selected { border-color: var(--gold); background: #fffbf0; }
.co-icon { font-size: 1.4rem; flex-shrink: 0; }
.co-info { flex: 1; }
.co-name { font-size: .82rem; font-weight: 600; color: var(--dark); }
.co-desc { font-size: .65rem; color: var(--light); margin-top: 2px; }
.co-check { color: var(--gold); font-size: 1rem; font-weight: 700; min-width: 16px; }

#clean-footer {
  padding: 10px 12px;
  padding-bottom: max(10px, env(safe-area-inset-bottom));
  background: var(--card);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}
#clean-btn {
  width: 100%;
  background: var(--dark);
  color: var(--gold2);
  border: none;
  border-radius: var(--radius);
  padding: 14px;
  font-size: .85rem;
  font-weight: 700;
  font-family: var(--font);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background .2s;
}
#clean-btn:disabled { opacity: .3; cursor: default; }
#clean-btn.done { background: var(--green); color: #fff; }

/* ── TOAST ── */
#toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--dark);
  color: var(--gold2);
  padding: 9px 18px;
  border-radius: 20px;
  font-size: .73rem;
  font-weight: 600;
  display: none;
  z-index: 999;
  white-space: nowrap;
  box-shadow: 0 4px 16px rgba(0,0,0,.3);
  max-width: 90vw;
  white-space: normal;
  text-align: center;
}

/* ── FALLBACK BANNER ── */
.fallback-banner {
  background: #fff8e6;
  border: 1px solid #fbbf24;
  border-radius: 8px;
  padding: 8px 12px;
  margin-bottom: 8px;
  font-size: .67rem;
  color: #92400e;
  display: flex;
  align-items: center;
  gap: 6px;
}
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <div class="h-icon">🛎</div>
  <div class="h-info">
    <div class="h-name" id="hotel-name">Otel</div>
    <div class="h-sub">e-Misafir · Dijital Servis</div>
  </div>
  <div class="h-room" id="room-badge">—</div>
</div>

<!-- TABS -->
<div id="tabs">
  <button type="button" class="tab active" onclick="switchTab('menu')">
    <span class="t-icon">🍽</span>Menü
  </button>
  <button type="button" class="tab" id="tab-chat" onclick="switchTab('chat')">
    <span class="t-icon">💬</span>Resepsiyon
    <span class="badge" id="chat-badge"></span>
  </button>
  <button type="button" class="tab" onclick="switchTab('clean')">
    <span class="t-icon">✨</span>Temizlik
  </button>
</div>

<!-- ══ MENÜ SCREEN ══ -->
<div id="s-menu" class="active">
  <div id="cat-bar"></div>
  <div id="time-bar">🕐 <span id="now-time"></span> — <span id="menu-stat">Yükleniyor...</span></div>
  <div id="menu-list"></div>
  <div id="cart-bar" class="hidden">
    <div>
      <div class="cart-info" id="cart-info">0 ürün</div>
      <div class="cart-total" id="cart-total">₺0</div>
    </div>
    <button type="button" id="cart-btn" onclick="openCheckout()">Siparişi Onayla →</button>
  </div>
</div>

<!-- Checkout modal -->
<div class="modal-overlay" id="modal-checkout">
  <div class="modal-sheet">
    <div class="modal-title">Sipariş Özeti</div>
    <div class="modal-sub">Lütfen kontrol edin</div>
    <div id="checkout-rows"></div>
    <div class="order-total">
      <span class="ot-label">Toplam</span>
      <span class="ot-val" id="checkout-total">₺0</span>
    </div>
    <div class="order-note">🏨 Tutar check-out'ta oda hesabınıza yansıtılacaktır.</div>
    <div class="modal-btns">
      <button type="button" class="btn-cancel" onclick="closeCheckout()">İptal</button>
      <button type="button" class="btn-confirm" id="confirm-btn" onclick="placeOrder()">✓ Siparişi Ver</button>
    </div>
  </div>
</div>

<!-- Success modal -->
<div class="modal-overlay modal-center" id="modal-success">
  <div class="modal-card">
    <div class="success-icon">✅</div>
    <div class="success-title">Siparişiniz Alındı!</div>
    <div class="success-sub">En kısa sürede odanıza getirileceğiz.<br>Sipariş No: <strong id="order-no-text"></strong></div>
    <button type="button" class="btn-ok" onclick="closeSuccess()">Tamam</button>
  </div>
</div>

<!-- ══ CHAT SCREEN ══ -->
<div id="s-chat">
  <div id="chat-status"><span class="status-dot"></span>Resepsiyon aktif</div>
  <div id="msg-list"></div>
  <div id="quick-chips">
    <button type="button" class="chip" onclick="sendQuick('Merhaba! Yardım eder misiniz?')">👋 Merhaba</button>
    <button type="button" class="chip" onclick="sendQuick('Havlu getirebilir misiniz?')">🛁 Havlu</button>
    <button type="button" class="chip" onclick="sendQuick('Taksi ayarlayabilir misiniz?')">🚕 Taksi</button>
    <button type="button" class="chip" onclick="sendQuick('Check-out saati ne zaman?')">🔑 Çıkış saati</button>
    <button type="button" class="chip" onclick="sendQuick('WiFi şifresi nedir?')">📶 WiFi</button>
    <button type="button" class="chip" onclick="sendQuick('Kahvaltı kaçta?')">🍳 Kahvaltı</button>
  </div>
  <div id="chat-input-wrap">
    <textarea id="chat-input" placeholder="Mesajınızı yazın..." rows="1"
      oninput="autoResize(this)"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
    <button type="button" id="chat-send" onclick="sendMsg()">➤</button>
  </div>
</div>

<!-- ══ TEMİZLİK SCREEN ══ -->
<div id="s-clean">
  <div id="clean-content">
    <div class="clean-note">⏰ Seçiminiz anında resepsiyona iletilecektir.</div>
    <button type="button" class="clean-opt" onclick="selectClean(this,'Tam Temizlik — Oda eksiksiz temizlensin')">
      <span class="co-icon">✨</span>
      <div class="co-info"><div class="co-name">Tam Temizlik</div><div class="co-desc">Oda eksiksiz temizlensin</div></div>
      <span class="co-check"></span>
    </button>
    <button type="button" class="clean-opt" onclick="selectClean(this,'Havlu Değişimi — Sadece havlular değiştirilsin')">
      <span class="co-icon">🛁</span>
      <div class="co-info"><div class="co-name">Havlu Değişimi</div><div class="co-desc">Sadece havlular değiştirilsin</div></div>
      <span class="co-check"></span>
    </button>
    <button type="button" class="clean-opt" onclick="selectClean(this,'Çarşaf Değişimi — Yatak takımları yenilensin')">
      <span class="co-icon">🛏</span>
      <div class="co-info"><div class="co-name">Çarşaf Değişimi</div><div class="co-desc">Yatak takımları yenilensin</div></div>
      <span class="co-check"></span>
    </button>
    <button type="button" class="clean-opt" onclick="selectClean(this,'Çöp Toplama — Çöpler alınsın')">
      <span class="co-icon">🗑</span>
      <div class="co-info"><div class="co-name">Çöp Toplama</div><div class="co-desc">Çöpler alınsın</div></div>
      <span class="co-check"></span>
    </button>
    <button type="button" class="clean-opt" onclick="selectClean(this,'Ekstra Malzeme — Şampuan, sabun, havlu ekle')">
      <span class="co-icon">🧴</span>
      <div class="co-info"><div class="co-name">Ekstra Malzeme</div><div class="co-desc">Şampuan, sabun, havlu ekle</div></div>
      <span class="co-check"></span>
    </button>
    <button type="button" class="clean-opt" onclick="selectClean(this,'Rahatsız Etme — Bugün temizlik istemiyorum')">
      <span class="co-icon">🔕</span>
      <div class="co-info"><div class="co-name">Rahatsız Etme</div><div class="co-desc">Bugün temizlik istemiyorum</div></div>
      <span class="co-check"></span>
    </button>
  </div>
  <div id="clean-footer">
    <button type="button" id="clean-btn" disabled onclick="sendClean()">Talebi Gönder</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
/* ── FIREBASE ── */
firebase.initializeApp({
  apiKey: "AIzaSyAV06sT1lBDNjMIA2EpoTK5uSRn3-mVqz4",
  authDomain: "emisafir-56796.firebaseapp.com",
  databaseURL: "https://emisafir-56796-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "emisafir-56796"
});
var db = firebase.database();
var TS = firebase.database.ServerValue.TIMESTAMP;

var DEMO_MENU = [
  {id:'k1', name:'Kahvaltı Tabağı', emoji:'🍳', price:280, category:'Kahvaltı'},
  {id:'k2', name:'Türk Kahvesi',    emoji:'☕', price:60,  category:'İçecekler'},
  {id:'k3', name:'Çay',             emoji:'🍵', price:40,  category:'İçecekler'},
  {id:'k4', name:'Tost',            emoji:'🥪', price:120, category:'Atıştırmalıklar'},
  {id:'k5', name:'Su 0.5L',         emoji:'💧', price:30,  category:'İçecekler'},
  {id:'k6', name:'Karışık Salata',  emoji:'🥗', price:150, category:'Salatalar'}
];

/* ── PARAMS ── */
var params = new URLSearchParams(location.search);
var HOTEL = params.get('hotel') || 'demo';
var ROOM  = params.get('room')  || '101';
document.getElementById('room-badge').textContent = 'Oda ' + ROOM;

/* ── REFS ── */
var rHotel = db.ref('hotels/' + HOTEL);
var rMsgs  = db.ref('hotels/' + HOTEL + '/rooms/' + ROOM + '/messages');
var rOrders= db.ref('hotels/' + HOTEL + '/orders');

/* ── TABS ── */
var currentTab = 'menu';
function switchTab(t) {
  currentTab = t;
  document.querySelectorAll('.tab').forEach(function(el, i) {
    el.classList.remove('active');
  });
  document.querySelectorAll('.screen, #s-menu, #s-chat, #s-clean').forEach(function(el) {
    el.classList.remove('active');
  });

  // highlight correct tab
  var tabOrder = ['menu','chat','clean'];
  document.querySelectorAll('.tab')[tabOrder.indexOf(t)].classList.add('active');
  document.getElementById('s-' + t).classList.add('active');

  if (t === 'menu') { updateCartBar(); }
  if (t === 'chat') {
    document.getElementById('chat-badge').classList.remove('show');
    scrollMsgs();
  }
  if (t === 'chat' || t === 'clean') {
    document.getElementById('cart-bar').classList.add('hidden');
  }
}

/* ── TOAST ── */
var toastTimer;
function showToast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { el.style.display = 'none'; }, 3000);
}

/* ── TIME ── */
function nowHHMM() {
  var d = new Date();
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function pad(n) { return String(n).padStart(2,'0'); }
function toMin(s) { if(!s) return 0; var p=s.split(':'); return +p[0]*60 + +p[1]; }
function nowMin() { var d=new Date(); return d.getHours()*60+d.getMinutes(); }
function isAvail(start, end) {
  if (!start || !end) return true;
  var n=nowMin(), s=toMin(start), e=toMin(end);
  if (s <= e) return n >= s && n <= e;
  return n >= s || n <= e; // gece geçişi
}
document.getElementById('now-time').textContent = nowHHMM();
setInterval(function(){ document.getElementById('now-time').textContent = nowHHMM(); }, 60000);

/* ════════════
   MENÜ
════════════ */
var cart = {}; // id → {name,price,emoji,qty}
var menuItems = [];
var activeCat = 'all';

var CAT_ORDER = [
  'Kahvaltı','Yumurta Çeşitleri','Peynir Çeşitleri','Şarküteri','Ekmek Çeşitleri',
  'Kahvaltı Ekleri','Sıcak Kahvaltılıklar','Sağlıklı Seçenekler',
  'Başlangıçlar','Türk Mezeleri','Uluslararası Başlangıçlar','Salatalar','Çorbalar',
  'Ana Yemekler','Kırmızı Et','Tavuk Yemekleri','Deniz Ürünleri','Vejetaryen & Vegan',
  'Burger Çeşitleri','Pizza Çeşitleri','Makarna Çeşitleri',
  'Atıştırmalıklar','Tatlılar',
  'İçecekler','Gazlı İçecekler','Meyve Suları','Kahve','Çay','Diğer İçecekler'
];

function useFallbackMenu() {
  menuItems = DEMO_MENU;
  buildCatBar();
  renderMenu();
  var avail = menuItems.filter(function(i){ return isAvail(i.startTime, i.endTime); });
  document.getElementById('menu-stat').textContent = avail.length + ' ürün (örnek menü)';
  var list = document.getElementById('menu-list');
  var banner = document.createElement('div');
  banner.className = 'fallback-banner';
  banner.textContent = '⚠️ Menü şu an yüklenemedi. Örnek menü gösteriliyor — lütfen resepsiyonu arayın.';
  list.insertBefore(banner, list.firstChild);
}

rHotel.child('menu').once('value', function(snap) {
  menuItems = [];
  if (!snap.exists()) {
    useFallbackMenu();
    return;
  }
  snap.forEach(function(c) {
    var v = c.val();
    if (v.active === false) return;
    menuItems.push(Object.assign({ id: c.key }, v));
  });

  if (menuItems.length === 0) {
    useFallbackMenu();
    return;
  }

  rHotel.child('info/name').once('value', function(s) {
    if (s.val()) document.getElementById('hotel-name').textContent = s.val();
  });

  buildCatBar();
  renderMenu();

  var avail = menuItems.filter(function(i){ return isAvail(i.startTime, i.endTime); });
  document.getElementById('menu-stat').textContent = avail.length + ' ürün mevcut';
}, function(error) {
  console.error('Menü yükleme hatası:', error.code, error.message);
  useFallbackMenu();
  showToast('⚠️ Menü yüklenemedi. Örnek menü gösteriliyor.');
});

function buildCatBar() {
  var bar = document.getElementById('cat-bar');
  bar.innerHTML = '';

  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'cat-btn active';
  btn.textContent = '🍽 Tümü';
  btn.onclick = function() { filterCat('all', btn); };
  bar.appendChild(btn);

  // collect cats that have available items
  var seen = {};
  var cats = [];
  menuItems.forEach(function(i) {
    if (!isAvail(i.startTime, i.endTime)) return;
    var c = i.category || 'Diğer';
    if (!seen[c]) { seen[c] = true; cats.push(c); }
  });

  // sort by CAT_ORDER
  cats.sort(function(a,b) {
    var ai = CAT_ORDER.indexOf(a), bi = CAT_ORDER.indexOf(b);
    if (ai<0) ai=99; if (bi<0) bi=99;
    return ai - bi;
  });

  cats.forEach(function(cat) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'cat-btn';
    b.textContent = cat;
    b.onclick = function() { filterCat(cat, b); };
    bar.appendChild(b);
  });
}

function filterCat(cat, btn) {
  activeCat = cat;
  document.querySelectorAll('.cat-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  renderMenu();
  document.getElementById('menu-list').scrollTop = 0;
}

function renderMenu() {
  var list = document.getElementById('menu-list');
  list.innerHTML = '';

  var items = menuItems.filter(function(i){
    if (!isAvail(i.startTime, i.endTime)) return false;
    if (activeCat !== 'all' && (i.category||'Diğer') !== activeCat) return false;
    return true;
  });

  if (!items.length) {
    list.innerHTML = '<div style="text-align:center;padding:40px;color:var(--light);font-size:.8rem">Bu saatte ürün bulunmuyor</div>';
    return;
  }

  // group by category
  var groups = {};
  items.forEach(function(i) {
    var c = i.category || 'Diğer';
    if (!groups[c]) groups[c] = [];
    groups[c].push(i);
  });

  var orderedCats = Object.keys(groups).sort(function(a,b){
    var ai=CAT_ORDER.indexOf(a), bi=CAT_ORDER.indexOf(b);
    if(ai<0)ai=99; if(bi<0)bi=99; return ai-bi;
  });

  orderedCats.forEach(function(cat) {
    if (activeCat === 'all') {
      var lbl = document.createElement('div');
      lbl.className = 'cat-label';
      lbl.textContent = cat;
      list.appendChild(lbl);
    }
    groups[cat].forEach(function(item) {
      list.appendChild(buildCard(item));
    });
  });
}

function buildCard(item) {
  var div = document.createElement('div');
  div.className = 'menu-item';
  div.id = 'card-' + item.id;
  div.innerHTML =
    '<div class="mi-emoji">' + (item.emoji||'🍽') + '</div>' +
    '<div class="mi-info">' +
      '<div class="mi-name">' + esc(item.name) + '</div>' +
      (item.description ? '<div class="mi-desc">' + esc(item.description) + '</div>' : '') +
      '<div class="mi-price">₺' + item.price + '</div>' +
    '</div>' +
    '<div class="mi-ctrl" id="ctrl-' + item.id + '"></div>';
  // Kart DOM'a eklenmeden önce querySelector kullan (getElementById DOM'da arar, bulamaz)
  var ctrlWrap = div.querySelector('[id="ctrl-' + item.id + '"]');
  var addBtn = document.createElement('button');
  addBtn.type = 'button';
  addBtn.className = 'add-btn';
  addBtn.textContent = '+';
  addBtn.onclick = function() { addToCart(item); };
  ctrlWrap.appendChild(addBtn);
  return div;
}

function refreshCtrl(item) {
  var wrap = document.getElementById('ctrl-' + item.id);
  if (!wrap) return;
  wrap.innerHTML = '';
  var qty = cart[item.id] ? cart[item.id].qty : 0;
  if (qty === 0) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'add-btn';
    btn.textContent = '+';
    btn.onclick = function() { addToCart(item); };
    wrap.appendChild(btn);
  } else {
    var ctrl = document.createElement('div');
    ctrl.className = 'qty-ctrl';
    ctrl.innerHTML =
      '<button type="button" onclick="changeQty(\'' + item.id + '\',-1)">−</button>' +
      '<span>' + qty + '</span>' +
      '<button type="button" onclick="changeQty(\'' + item.id + '\',1)">+</button>';
    wrap.appendChild(ctrl);
  }
}

function addToCart(item) {
  if (!cart[item.id]) {
    cart[item.id] = { name: item.name, price: item.price, emoji: item.emoji||'🍽', qty: 0 };
  }
  cart[item.id].qty++;
  refreshCtrl(item);
  updateCartBar();
}

function changeQty(id, delta) {
  if (!cart[id]) return;
  cart[id].qty += delta;
  if (cart[id].qty <= 0) delete cart[id];
  var item = menuItems.find(function(i){ return i.id===id; });
  if (item) refreshCtrl(item);
  updateCartBar();
}

function updateCartBar() {
  var total = 0, count = 0;
  Object.values(cart).forEach(function(c){ total += c.price*c.qty; count += c.qty; });
  var bar = document.getElementById('cart-bar');
  if (count > 0 && currentTab === 'menu') {
    bar.classList.remove('hidden');
  } else {
    bar.classList.add('hidden');
  }
  document.getElementById('cart-info').textContent = count + ' ürün';
  document.getElementById('cart-total').textContent = '₺' + total;
}

/* Checkout */
function openCheckout() {
  var rows = document.getElementById('checkout-rows');
  rows.innerHTML = '';
  var total = 0;
  Object.entries(cart).forEach(function(pair) {
    var id=pair[0], c=pair[1];
    var sub = c.price * c.qty;
    total += sub;
    var row = document.createElement('div');
    row.className = 'order-row';
    row.innerHTML =
      '<div><div class="or-name">' + c.emoji + ' ' + esc(c.name) + '</div>' +
      '<div class="or-qty">x' + c.qty + '</div></div>' +
      '<div class="or-price">₺' + sub + '</div>';
    rows.appendChild(row);
  });
  document.getElementById('checkout-total').textContent = '₺' + total;
  document.getElementById('modal-checkout').classList.add('open');
}
function closeCheckout() {
  document.getElementById('modal-checkout').classList.remove('open');
}
function closeSuccess() {
  document.getElementById('modal-success').classList.remove('open');
}

function placeOrder() {
  var btn = document.getElementById('confirm-btn');
  btn.disabled = true;
  btn.textContent = 'Gönderiliyor...';

  var orderItems = [];
  var total = 0;
  Object.entries(cart).forEach(function(pair) {
    var c = pair[1];
    var sub = c.price * c.qty;
    total += sub;
    orderItems.push({ name:c.name, emoji:c.emoji, price:c.price, qty:c.qty, subtotal:sub });
  });

  var no = 'ORD-' + Date.now().toString(36).toUpperCase();
  var now = new Date();
  var timeStr = pad(now.getHours()) + ':' + pad(now.getMinutes());

  rOrders.push({
    orderNo: no, room: ROOM, hotel: HOTEL,
    items: orderItems, total: total,
    status: 'pending',
    time: timeStr, ts: TS
  }).then(function() {
    closeCheckout();
    document.getElementById('order-no-text').textContent = no;
    document.getElementById('modal-success').classList.add('open');
    cart = {};
    renderMenu();
    updateCartBar();
    btn.disabled = false;
    btn.textContent = '✓ Siparişi Ver';
  }).catch(function(e) {
    console.error('Sipariş gönderilemedi:', e.code, e.message);
    showToast('❌ Sipariş gönderilemedi. Lütfen tekrar deneyin veya resepsiyonu arayın.');
    btn.disabled = false;
    btn.textContent = '✓ Siparişi Ver';
  });
}

/* ════════════
   CHAT
════════════ */
var seenMsgs = {};
var chatReady = false;

// Hoşgeldin mesajı (lokal, db'ye yazma)
(function(){
  var d = document.createElement('div');
  d.className = 'msg-row';
  d.innerHTML =
    '<div class="msg-avatar">R</div>' +
    '<div class="msg-body">' +
      '<div class="msg-bubble">Merhaba! 👋 Oda ' + ROOM + "'e hoş geldiniz. Size nasıl yardımcı olabilirim?</div>" +
      '<div class="msg-time">' + nowHHMM() + '</div>' +
    '</div>';
  document.getElementById('msg-list').appendChild(d);
})();

// Günlük temizlik: yeni gün veya yeni misafir → eski mesajları sil
var today = new Date().toISOString().slice(0, 10); // YYYY-MM-DD
rHotel.child('rooms/' + ROOM + '/lastReset').once('value', function(snap) {
  if (snap.val() !== today) {
    rMsgs.remove();
    rHotel.child('rooms/' + ROOM + '/lastReset').set(today);
  }
  startMsgsListener();
});

function startMsgsListener() {
  rMsgs.on('child_added', function(snap) {
    var key = snap.key;
    if (seenMsgs[key]) return;
    seenMsgs[key] = true;

    var v = snap.val();
    var isSent = (v.sender === 'guest');
    appendMsg(v.text, isSent, v.time);

    if (!isSent && chatReady) {
      if (currentTab !== 'chat') {
        document.getElementById('chat-badge').classList.add('show');
        showToast('📩 Resepsiyondan yanıt geldi!');
      }
    }
    chatReady = true;
  });
}

function appendMsg(text, isSent, ts) {
  var list = document.getElementById('msg-list');
  var d = document.createElement('div');
  d.className = 'msg-row' + (isSent ? ' sent' : '');
  var time = ts ? new Date(ts) : new Date();
  var timeStr = pad(time.getHours()) + ':' + pad(time.getMinutes());

  if (isSent) {
    d.innerHTML =
      '<div class="msg-body">' +
        '<div class="msg-bubble">' + esc(text).replace(/\n/g,'<br>') + '</div>' +
        '<div class="msg-time">' + timeStr + '</div>' +
      '</div>';
  } else {
    d.innerHTML =
      '<div class="msg-avatar">R</div>' +
      '<div class="msg-body">' +
        '<div class="msg-bubble">' + esc(text).replace(/\n/g,'<br>') + '</div>' +
        '<div class="msg-time">' + timeStr + '</div>' +
      '</div>';
  }
  list.appendChild(d);
  scrollMsgs();
}

function scrollMsgs() {
  var el = document.getElementById('msg-list');
  el.scrollTop = el.scrollHeight;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 90) + 'px';
}

function sendMsg() {
  var inp = document.getElementById('chat-input');
  var text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  inp.style.height = '38px';
  doSend(text);
}

function sendQuick(text) { doSend(text); }

function doSend(text) {
  // Firebase key'ini senkron olarak al, child_added'dan önce işaretle
  var newRef = rMsgs.push();
  seenMsgs[newRef.key] = true;
  appendMsg(text, true, Date.now()); // Optimistic UI
  newRef.set({ text: text, sender: 'guest', time: TS }).catch(function(e) {
    console.error(e);
    showToast('Mesaj gönderilemedi.');
  });
}

/* ════════════
   TEMİZLİK
════════════ */
var cleanSelected = '';

function selectClean(btn, val) {
  document.querySelectorAll('.clean-opt').forEach(function(o) {
    o.classList.remove('selected');
    o.querySelector('.co-check').textContent = '';
  });
  btn.classList.add('selected');
  btn.querySelector('.co-check').textContent = '✓';
  cleanSelected = val;
  document.getElementById('clean-btn').disabled = false;
}

function sendClean() {
  if (!cleanSelected) return;
  var btn = document.getElementById('clean-btn');
  btn.disabled = true;
  btn.textContent = 'Gönderiliyor...';

  rMsgs.push({
    text: '🧹 Temizlik talebi: ' + cleanSelected,
    sender: 'guest',
    time: TS
  }).then(function() {
    btn.textContent = '✓ Gönderildi!';
    btn.classList.add('done');
    document.querySelectorAll('.clean-opt').forEach(function(o) {
      o.classList.remove('selected');
      o.querySelector('.co-check').textContent = '';
    });
    cleanSelected = '';
    setTimeout(function() {
      btn.textContent = 'Talebi Gönder';
      btn.classList.remove('done');
      btn.disabled = true;
    }, 3000);
  }).catch(function(e) {
    console.error(e);
    btn.textContent = 'Talebi Gönder';
    btn.disabled = false;
    showToast('Hata! Tekrar deneyin.');
  });
}

/* ── UTIL ── */
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
