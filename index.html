<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#1a1a2e"/>
  <title>e-Misafir</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:sans-serif;background:#faf7f2;height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
    #header{background:#1a1a2e;padding:16px 20px;display:flex;align-items:center;gap:14px}
    .ava{width:44px;height:44px;background:rgba(201,168,76,.15);border:1.5px solid #c9a84c;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem}
    .name{color:#fff;font-size:1rem}
    .sub{color:#c9a84c;font-size:.7rem;margin-top:2px}
    .badge{background:rgba(201,168,76,.15);border:1px solid rgba(201,168,76,.4);border-radius:20px;padding:5px 14px;font-size:.75rem;color:#c9a84c;margin-left:auto}
    #msgs{flex:1;overflow-y:auto;padding:20px 16px 8px;display:flex;flex-direction:column;gap:12px}
    .msg{display:flex;gap:8px;align-items:flex-end}
    .msg.user{flex-direction:row-reverse}
    .msg-ava{width:30px;height:30px;border-radius:50%;background:#1a1a2e;border:1.5px solid #c9a84c;display:flex;align-items:center;justify-content:center;font-size:.72rem;color:#c9a84c;flex-shrink:0}
    .bubble{max-width:78%;padding:10px 15px;border-radius:18px 18px 18px 4px;background:#fff;color:#1a1a2e;font-size:.87rem;line-height:1.55;border:1px solid rgba(26,26,46,.1);box-shadow:0 2px 8px rgba(0,0,0,.06)}
    .msg.user .bubble{background:#1a1a2e;color:#fff;border-radius:18px 18px 4px 18px;border-color:transparent}
    .time{font-size:.64rem;color:#9a8f80;margin-top:3px}
    #quick{padding:0 16px 12px}
    .qlabel{font-size:.67rem;color:#9a8f80;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px}
    #qrow{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
    .chip{background:#fff;border:1.5px solid rgba(26,26,46,.1);border-radius:20px;padding:7px 13px;font-size:.75rem;color:#1a1a2e;cursor:pointer;white-space:nowrap}
    #input-area{background:#fff;border-top:1px solid rgba(26,26,46,.1);padding:12px 16px 20px;display:flex;gap:10px;align-items:flex-end}
    #inp{flex:1;background:#f0ebe1;border:1.5px solid rgba(26,26,46,.1);border-radius:22px;padding:10px 18px;font-size:.87rem;color:#1a1a2e;outline:none;resize:none;min-height:42px;line-height:1.4;font-family:sans-serif}
    #sendbtn{width:44px;height:44px;border-radius:50%;background:#1a1a2e;border:none;color:#c9a84c;font-size:1rem;cursor:pointer;flex-shrink:0}
    .typing{display:flex;gap:5px;padding:14px 18px;background:#fff;border-radius:18px 18px 18px 4px;border:1px solid rgba(26,26,46,.1)}
    .dot{width:7px;height:7px;background:#c9a84c;border-radius:50%;animation:bounce 1.2s infinite}
    .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
    @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-5px);opacity:1}}
  </style>
</head>
<body>
  <div id="header">
    <div class="ava">🛎</div>
    <div>
      <div class="name">Resepsiyon</div>
      <div class="sub">e-Misafir · Oda <span id="rname">101</span></div>
    </div>
    <div class="badge" id="rbadge">101</div>
  </div>
  <div id="msgs"></div>
  <div id="quick">
    <div class="qlabel">Hızlı Talep</div>
    <div id="qrow">
      <button class="chip" onclick="send('Odamı temizler misiniz?')">✨ Temizlik</button>
      <button class="chip" onclick="send('Temiz havlu getirir misiniz?')">🛁 Havlu</button>
      <button class="chip" onclick="send('Oda servisi menüsü nedir?')">🍽 Oda Servisi</button>
      <button class="chip" onclick="send('Taksi çağırabilir misiniz?')">🚕 Taksi</button>
      <button class="chip" onclick="send('Check-out saati ne zaman?')">🔑 Çıkış</button>
      <button class="chip" onclick="send('WiFi şifresi nedir?')">📶 WiFi</button>
    </div>
  </div>
  <div id="input-area">
    <textarea id="inp" placeholder="Mesajınızı yazın..." rows="1"
      oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,100)+'px'"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea>
    <button id="sendbtn" onclick="send()">➤</button>
  </div>
  <script>
    const SYSTEM = `Sen bir otel resepsiyon asistanısın. Türkçe konuş, kısa ve nazik cevap ver. Talep aldığında "✓ İletildi, en kısa sürede ilgileniyoruz." de. Emoji kullan ama abartma.`;
    const room = new URLSearchParams(location.search).get('room') || '101';
    document.getElementById('rname').textContent = room;
    document.getElementById('rbadge').textContent = room;
    const history = [];
    let loading = false;

    function fmtTime(){return new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});}

    function addMsg(text, from){
      const msgs = document.getElementById('msgs');
      const div = document.createElement('div');
      div.className = 'msg' + (from==='user'?' user':'');
      if(from!=='user'){
        div.innerHTML = `<div class="msg-ava">e</div><div><div class="bubble">${text.replace(/\n/g,'<br>')}</div><div class="time">${fmtTime()}</div></div>`;
      } else {
        div.innerHTML = `<div><div class="bubble">${text.replace(/\n/g,'<br>')}</div><div class="time" style="text-align:right">${fmtTime()}</div></div>`;
      }
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    function addTyping(){
      const msgs = document.getElementById('msgs');
      const div = document.createElement('div');
      div.className = 'msg'; div.id = 'typing';
      div.innerHTML = `<div class="msg-ava">e</div><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
      msgs.appendChild(div);
      msgs.scrollTop = msgs.scrollHeight;
    }

    addMsg(`Merhaba! 👋 Oda ${room}'e hoş geldiniz.\nSize nasıl yardımcı olabilirim?`,'bot');

    async function send(text){
      const inp = document.getElementById('inp');
      const msg = text || inp.value.trim();
      if(!msg||loading) return;
      inp.value=''; inp.style.height='42px';
      document.getElementById('quick').style.display='none';
      loading = true;
      addMsg(msg,'user');
      history.push({role:'user',content:msg});
      addTyping();
      try{
        const res = await fetch('/api/chat',{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({
            model:'claude-sonnet-4-20250514',
            max_tokens:1000,
            system: SYSTEM,
            messages: history
          })
        });
        const data = await res.json();
        const reply = data.content?.[0]?.text || 'Bir sorun oluştu.';
        history.push({role:'assistant',content:reply});
        document.getElementById('typing')?.remove();
        addMsg(reply,'bot');
      } catch(e){
        document.getElementById('typing')?.remove();
        addMsg('Bağlantı sorunu, lütfen tekrar deneyin.','bot');
      }
      loading=false;
    }
  </script>
</body>
</html>
