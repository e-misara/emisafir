window.loadMenus = async function() {
  const hotelId = document.getElementById('hotel-sel').value;
  if (!hotelId) { alert('Otel seçin'); return; }
  const log = document.getElementById('log');
  log.innerHTML = `<span style="color:#f59e0b">⏳ ${FULL_MENU.length} ürün yükleniyor...</span><br/>`;

  for (let i = 0; i < FULL_MENU.length; i++) {
    const item = FULL_MENU[i];
    await push(ref(db, `hotels/${hotelId}/menu`), {...item, active: true});
    document.getElementById('prog').style.width = ((i+1)/FULL_MENU.length*100)+'%';
    if (i % 10 === 0) {
      log.innerHTML += `✓ ${item.category}: ${item.name}<br/>`;
      log.scrollTop = log.scrollHeight;
    }
  }
  log.innerHTML += `<br/><span style="color:#c9a84c">🎉 ${FULL_MENU.length} ürün başarıyla yüklendi!</span><br/>`;
  log.innerHTML += `<a href="/misafir.html?hotel=${hotelId}&room=101" style="color:#c9a84c">→ Misafir ekranını test et</a>`;
}

window.clearMenu = async function() {
  const hotelId = document.getElementById('hotel-sel').value;
  if (!hotelId) { alert('Otel seçin'); return; }
  if (!confirm(`${hotelId} otelinin tüm menüsü silinsin mi?`)) return;
  await remove(ref(db, `hotels/${hotelId}/menu`));
  document.getElementById('log').innerHTML = '✓ Menü temizlendi';
}
</script>
